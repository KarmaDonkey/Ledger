    var over = buffer < 0;
    return '<div class="bucket-card">' +
      '<div class="bucket-card-label">This period</div>' +
      '<div class="bucket-card-amt ' + (over ? 'over' : 'good') + '">' + formatMoney(buffer) + '</div>' +
      '<p class="hint" style="margin-top:4px;">buffer for planned purchases</p>' +
      '<button type="button" class="scan-link bucket-move" id="moveToFunBtn" style="justify-content:flex-start;padding-left:0;">Move to Fun \u203a</button>' +
      '</div>';
  }

  function funCardHtml() {
    var balance = funBalance();
    var target = state.buckets.funTarget;
    var note = state.buckets.funNote;
    var hasTarget = target !== null && !isNaN(target) && target > 0;
    var over = balance < 0;
    var pct = hasTarget ? Math.max(0, Math.min(100, Math.round(balance / target * 100))) : 0;
    return '<div class="bucket-card">' +
      '<div class="bucket-card-label">Fun</div>' +
      '<div class="bucket-card-amt ' + (over ? 'over' : 'good') + '">' + formatMoney(balance) + '</div>' +
      (hasTarget
        ? '<div class="cat-bar"><div class="cat-bar-fill' + (over ? ' over' : '') + '" style="width:' + (over ? 100 : pct) + '%"></div></div>' +
          '<p class="hint" style="margin-top:4px;">of ' + formatMoney(target) + (note ? ' — ' + note.replace(/</g, '&lt;') : '') + '</p>'
        : '') +
      '<button type="button" class="scan-link bucket-move" id="moveToBufferBtn" style="justify-content:flex-start;padding-left:0;">Move to buffer \u203a</button>' +
      '</div>';
  }

  function recordTransfer(amount) {
    state.buckets.transfers.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: todayKey(),
      amount: Math.round(amount * 100) / 100,
      at: Date.now()
    });
    saveBuckets();
    scheduleSync();
  }

  // direction 'toFun' moves from this period's buffer into Fun; 'toBuffer'
  // moves from Fun back into this period's buffer.
  function openMovePanel(direction) {
    var toFun = direction === 'toFun';
    var period = currentMonthPeriod();
    var buffer = periodBuffer(period);
    var fun = funBalance();
    var carryIn = carryInForPeriod(period);
    var max = Math.max(0, toFun ? buffer : fun);
    var quick = '';
    if (toFun && carryIn > 0.005 && Math.min(carryIn, max) > 0.005) {
      quick += '<button type="button" class="btn btn-secondary" id="moveQuickCarry" style="flex:1;">Carried in (' + formatMoney(Math.min(carryIn, max)) + ')</button>';
    }
    if (max > 0.005) quick += '<button type="button" class="btn btn-secondary" id="moveQuickAll" style="flex:1;">All (' + formatMoney(max) + ')</button>';
    var recent = state.buckets.transfers.slice().sort(function (a, b) { return b.at - a.at; }).slice(0, 5);
    panel.innerHTML = '<h2>' + (toFun ? 'Move to Fun' : 'Move to buffer') + '</h2>' +
      '<p class="hint">' + (toFun
        ? 'This period\u2019s buffer is ' + formatMoney(buffer) + (carryIn > 0.005 ? ', including ' + formatMoney(carryIn) + ' carried in from last period' : '') + '. Money you move to Fun leaves the buffer for planned purchases.'
        : 'Fun has ' + formatMoney(fun) + '. Money you move back goes into this period\u2019s buffer.') + '</p>' +
      '<div class="field"><label for="moveAmountInput">Amount</label>' +
      '<input type="text" inputmode="decimal" id="moveAmountInput" class="mono-input" placeholder="0" autocomplete="off"></div>' +
      (quick ? '<div class="panel-actions" style="margin-top:0;margin-bottom:8px;">' + quick + '</div>' : '') +
      '<p class="scan-error" id="moveError" hidden></p>' +
      (recent.length
        ? '<div class="field"><label>Recent moves</label>' + recent.map(function (t) {
            return '<div class="hint" style="display:flex;justify-content:space-between;"><span>' + t.date + ' \u00b7 ' + (t.amount > 0 ? 'to Fun' : 'to buffer') +
              '</span><span class="mono">' + formatMoney(Math.abs(t.amount)) + '</span></div>';
          }).join('') + '</div>'
        : '') +
      '<div class="panel-actions"><button class="btn btn-secondary" id="moveCancel">Cancel</button>' +
      '<button class="btn btn-primary" id="moveConfirm">' + (toFun ? 'Move to Fun' : 'Move to buffer') + '</button></div>';
    showPanel();
    var input = document.getElementById('moveAmountInput');
    setTimeout(function () { input.focus(); }, 50);
    function setAmount(v) { input.value = v.toFixed(2).replace('.', ','); }
    var qc = document.getElementById('moveQuickCarry');
    if (qc) qc.addEventListener('click', function () { setAmount(Math.min(carryIn, max)); });
    var qa = document.getElementById('moveQuickAll');
    if (qa) qa.addEventListener('click', function () { setAmount(max); });
    document.getElementById('moveCancel').addEventListener('click', closePanel);
    document.getElementById('moveConfirm').addEventListener('click', function () {
      var v = parseFloat(input.value.replace(/\s/g, '').replace(',', '.'));
      var err = document.getElementById('moveError');
      if (isNaN(v) || v <= 0) { err.textContent = 'Enter an amount above zero.'; err.hidden = false; input.focus(); return; }
      if (v > max + 0.005) {
        err.textContent = max > 0.005
          ? 'You can move at most ' + formatMoney(max) + ' ' + (toFun ? 'from the buffer.' : 'from Fun.')
          : (toFun ? 'There is nothing in the buffer to move.' : 'There is nothing in Fun to move.');
        err.hidden = false; input.focus(); return;
      }
      recordTransfer(toFun ? v : -v);
      closePanel();
      render();
    });
  }

  function recordSettlement(period, data) {
    state.buckets.settlements.push({
      periodKey: periodKeyFor(period),
      bufferAtEnd: data.bufferAtEnd,
      takenFromFun: data.takenFromFun,
      toFun: data.toFun,
      carryToNext: data.carryToNext,
      settledAt: Date.now()
    });
    saveBuckets();
    scheduleSync();
  }

  // Only ever looks one period back — if the app hasn't been opened for
  // several months in a row, older gaps are left unsettled (their buffer
  // is simply not carried forward) rather than prompting through a
  // backlog.
  function findUnsettledPeriod() {
    if (state.allowance === null || isNaN(state.allowance) || !state.buckets.trackingStart) return null;
    var current = currentMonthPeriod();
    var candidate = getMonthPeriod(shiftPeriod(current, 'month', state.monthStartDay, -1), state.monthStartDay);
    var trackingStart = new Date(state.buckets.trackingStart + 'T00:00:00');
    if (candidate.end.getTime() < trackingStart.getTime()) return null;
    if (settlementFor(periodKeyFor(candidate))) return null;
    return candidate;
  }

  function openSettlementPanel(period) {
    var buffer = periodBuffer(period);
    var label = formatPeriodLabel('month', period);
    if (Math.abs(buffer) < 0.005) {
      recordSettlement(period, { bufferAtEnd: 0, takenFromFun: 0, toFun: 0, carryToNext: 0 });
      render();
      return;
    }
    if (buffer > 0) {
      panel.innerHTML = '<h2>Period ended</h2>' +
        '<p class="hint">' + label + ' ended ' + formatMoney(buffer) + ' under budget. How much do you want to carry into the new period? The rest goes to Fun.</p>' +
        '<div class="field"><label for="carryAmountInput">Carry forward</label>' +
        '<input type="text" inputmode="decimal" id="carryAmountInput" class="mono-input" value="' + buffer.toFixed(2).replace('.', ',') + '"></div>' +
        '<p class="hint" id="toFunPreview"></p>' +
        '<div class="panel-actions"><button class="btn btn-primary" id="confirmSettlement" style="width:100%;">Confirm</button></div>';
      showPanel();
      var input = document.getElementById('carryAmountInput');
      function clamp(v) { return Math.max(0, Math.min(buffer, isNaN(v) ? 0 : v)); }
      function updatePreview() {
        var v = clamp(parseFloat(input.value.replace(',', '.')));
        document.getElementById('toFunPreview').textContent = formatMoney(Math.max(0, buffer - v)) + ' goes to Fun.';
      }
      input.addEventListener('input', updatePreview);
      updatePreview();
      document.getElementById('confirmSettlement').addEventListener('click', function () {
        var v = clamp(parseFloat(input.value.replace(',', '.')));
        recordSettlement(period, { bufferAtEnd: buffer, takenFromFun: 0, toFun: buffer - v, carryToNext: v });
        closePanel();
        render();
      });
    } else {
      panel.innerHTML = '<h2>Period ended</h2>' +
        '<p class="hint">' + label + ' ended ' + formatMoney(Math.abs(buffer)) + ' over budget. Cover the deficit from Fun (' + formatMoney(funBalance()) + ' available)?</p>' +
        '<div class="panel-actions">' +
        '<button class="btn btn-secondary" id="deficitNo" style="flex:1;">No</button>' +
        '<button class="btn btn-primary" id="deficitYes" style="flex:1;">Yes</button>' +
        '</div>';
      showPanel();
      function proceedToStep2(takenFromFun) {
        var remaining = buffer + takenFromFun;
        if (remaining >= -0.005) {
          recordSettlement(period, { bufferAtEnd: buffer, takenFromFun: takenFromFun, toFun: 0, carryToNext: 0 });
          closePanel();
          render();
          return;
        }
        panel.innerHTML = '<h2>Period ended</h2>' +
          '<p class="hint">' + formatMoney(Math.abs(remaining)) + ' of the deficit remains. Carry it into the new period, or clear it to zero?</p>' +
          '<div class="panel-actions">' +
          '<button class="btn btn-secondary" id="zeroDeficit" style="flex:1;">Clear to zero</button>' +
          '<button class="btn btn-primary" id="carryDeficit" style="flex:1;">Carry it over</button>' +
          '</div>';
        showPanel();
        document.getElementById('zeroDeficit').addEventListener('click', function () {
          recordSettlement(period, { bufferAtEnd: buffer, takenFromFun: takenFromFun, toFun: 0, carryToNext: 0 });
          closePanel();
          render();
        });
        document.getElementById('carryDeficit').addEventListener('click', function () {
          recordSettlement(period, { bufferAtEnd: buffer, takenFromFun: takenFromFun, toFun: 0, carryToNext: remaining });
          closePanel();
          render();
        });
      }
      document.getElementById('deficitNo').addEventListener('click', function () { proceedToStep2(0); });
      document.getElementById('deficitYes').addEventListener('click', function () {
        var taken = Math.min(funBalance(), Math.abs(buffer));
        proceedToStep2(taken);
      });
    }
  }

  function openCapybaraLightbox(variant, title, subtitle, muted) {
    var box = document.getElementById('capybaraLightbox');
    box.innerHTML = '<div class="capybara-lightbox-card">' +
      '<div style="opacity:' + (muted ? '0.35' : '1') + ';">' + capybaraSvg(variant, 200, !muted) + '</div>' +
      '<p>' + title + '</p>' +
      (subtitle ? '<p class="hint">' + subtitle + '</p>' : '') +
      '</div>';
    box.hidden = false;
  }

  function updateStreakBadge() {
    var el = document.getElementById('streakBadge');
    if (!el) return;
    if (state.allowance === null || isNaN(state.allowance)) { el.hidden = true; return; }
    var streak = computeStreak();
    el.hidden = false;
    el.innerHTML = capybaraSvg('plain', 16) + '<span>' + streak + (streak === 1 ? ' dags streak' : ' dagars streak') + '</span>';
  }

  function checkBadges() {
    var earned = state.badges.slice();
    var changed = false;
    function unlock(id) { if (earned.indexOf(id) === -1) { earned.push(id); changed = true; } }

    if (computeStreak() >= 7) unlock('streak7');

    if (state.allowance !== null && !isNaN(state.allowance)) {
      var todayPeriod = getMonthPeriod(new Date(), state.monthStartDay);
      var prevAnchor = shiftPeriod(todayPeriod, 'month', state.monthStartDay, -1);
      var prevPeriod = getMonthPeriod(prevAnchor, state.monthStartDay);
      var prevItems = entriesInPeriod(prevPeriod).filter(function (e) { return e.bucket !== 'fun'; });
      if (prevItems.length > 0) {
        var prevTotal = periodTotal(prevItems);
        var prevDays = Math.round((prevPeriod.end - prevPeriod.start) / 86400000) + 1;
        if (prevTotal <= state.allowance * prevDays) unlock('monthUnderBudget');
      }
    }

    if (state.entries.some(function (e) { return !!e.bucket; })) unlock('bucketCashout');

    var funTarget = state.buckets.funTarget;
    if (funTarget !== null && !isNaN(funTarget) && funTarget > 0) {
      var funBal = funBalance();
      FUN_MILESTONES.forEach(function (pct) {
        if (funBal >= funTarget * (pct / 100)) unlock(funMilestoneBadgeId(pct));
      });
    }

    if (changed) { state.badges = earned; saveBadges(); }
  }

  function renderAnalysis() {
    var view = document.getElementById('analysisView');
    var type = analysisState.periodType;
    var period = getPeriod(type, analysisState.anchor, state.monthStartDay);
    var items = entriesInPeriod(period);
    var budgetItems = items.filter(function (e) { return e.bucket !== 'fun'; });
    var total = periodTotal(budgetItems);
    var days = Math.round((period.end - period.start) / 86400000) + 1;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var elapsedDays = days;
    if (period.start.getTime() > today.getTime()) {
      elapsedDays = 1;
    } else if (period.end.getTime() > today.getTime()) {
      elapsedDays = Math.round((today - period.start) / 86400000) + 1;
    }
    var mode = type === 'day' ? 'total' : analysisState.mode;
    var displayValue = mode === 'average' ? total / elapsedDays : total;
    var hasAllowance = state.allowance !== null && !isNaN(state.allowance);

    var html = '';
    html += '<div class="type-toggle" id="periodTypeToggle">' +
      ['day', 'month', 'year'].map(function (t) {
        var lbl = t === 'day' ? 'Day' : t === 'month' ? 'Month' : 'Year';
        return '<button type="button" class="type-btn' + (t === type ? ' active' : '') + '" data-type="' + t + '">' + lbl + '</button>';
      }).join('') + '</div>';

    if (!hasAllowance) {
      html += '<div class="goal-block"><p class="hint">Set a daily allowance in Settings to start tracking your buffer.</p></div>';
    } else {
      html += '<div class="goal-block"><div class="bucket-row">' + bufferCardHtml() + funCardHtml() + '</div></div>';
    }

    html += '<div class="period-nav">' +
      '<button type="button" class="icon-btn" id="periodPrev" aria-label="Previous period">‹</button>' +
      '<span class="period-label">' + formatPeriodLabel(type, period) + '</span>' +
      '<button type="button" class="icon-btn" id="periodNext" aria-label="Next period">›</button>' +
      '</div>';

    html += '<div class="hero" style="padding:8px 0 14px;border-bottom:none;">' +
      '<p class="hero-amount mono">' + formatMoney(displayValue) + '</p>';
    if (hasAllowance) {
      var budget = mode === 'average' ? state.allowance : state.allowance * days;
      var diff = budget - displayValue;
      html += '<p class="hero-sub ' + (diff >= 0 ? 'good' : 'over') + '">' +
        (diff >= 0
          ? formatMoney(diff) + ' left of ' + formatMoney(budget)
          : formatMoney(Math.abs(diff)) + ' over ' + formatMoney(budget)) +
        (mode === 'average' ? ' per day' : '') + '</p>';
    }
    html += '</div>';

    if (type !== 'day') {
      html += '<div class="type-toggle" id="modeToggle" style="margin-bottom:16px;">' +
        '<button type="button" class="type-btn' + (mode === 'total' ? ' active' : '') + '" data-mode="total">Total</button>' +
        '<button type="button" class="type-btn' + (mode === 'average' ? ' active' : '') + '" data-mode="average">Avg / day</button>' +
        '</div>';
    }

    if (type !== 'day' && !analysisState.drillCategory) {
      var chartStart = (type === 'month') ? carryInForPeriod(period) - transferNet(period) : 0;
      html += budgetTrendChartHtml(period, days, budgetItems, chartStart);
    }

    if (analysisState.drillCategory) {
      var catItems = items.filter(function (e) { return (e.category || UNCATEGORIZED) === analysisState.drillCategory; })
        .sort(function (a, b) { return b.ts - a.ts; });
      html += '<button type="button" class="scan-link" id="backToBreakdown" style="justify-content:flex-start;padding-left:0;">‹ Back</button>';
      html += '<h2 style="font-size:16px;margin:6px 0 10px;">' + analysisState.drillCategory + '</h2>';
      if (catItems.length === 0) {
        html += '<p class="hint">No transactions.</p>';
      } else {
        catItems.forEach(function (e) {
          html += '<div class="entry-row" data-id="' + e.id + '">' +
            '<span class="entry-desc">' + (e.description || '(no description)') +
            (e.bucket ? '<span class="entry-bucket-tag">' + BUCKET_LABELS[e.bucket] + '</span>' : '') +
            (e.updatedBy ? '<span class="entry-author-tag">' + authorLabel(e.updatedBy).replace(/</g, '&lt;') + '</span>' : '') + '</span>' +
            '<span class="entry-amount mono' + (e.amount < 0 ? ' refund' : '') + '">' + formatMoney(e.amount) + '</span>' +
            '</div>';
        });
      }
    } else {
      var breakdown = categoryBreakdown(items);
      if (breakdown.length === 0) {
        html += '<p class="hint" style="margin-top:20px;">Nothing logged in this period.</p>';
      } else {
        var basis = breakdown.reduce(function (s, b) { return s + Math.abs(b.total); }, 0) || 1;
        html += '<div class="cat-breakdown">';
        breakdown.forEach(function (b) {
          var pct = Math.round(Math.abs(b.total) / basis * 100);
          html += '<div class="cat-row" data-cat="' + b.category.replace(/"/g, '&quot;') + '">' +
            '<div class="cat-row-top"><span class="cat-name">' + b.category + '</span><span class="cat-amt">' + formatMoney(b.total) + '</span></div>' +
            '<div class="cat-bar"><div class="cat-bar-fill" style="width:' + pct + '%"></div></div>' +
            '</div>';
        });
        html += '</div>';
      }
    }

    view.innerHTML = html;
    bindAnalysisEvents();
  }

  function bindAnalysisEvents() {
    document.querySelectorAll('#periodTypeToggle .type-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        analysisState.periodType = btn.dataset.type;
        analysisState.drillCategory = null;
        renderAnalysis();
      });
    });
    var modeToggle = document.getElementById('modeToggle');
    if (modeToggle) {
      modeToggle.querySelectorAll('.type-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          analysisState.mode = btn.dataset.mode;
          renderAnalysis();
        });
      });
    }
    document.getElementById('periodPrev').addEventListener('click', function () {
      var period = getPeriod(analysisState.periodType, analysisState.anchor, state.monthStartDay);
      analysisState.anchor = shiftPeriod(period, analysisState.periodType, state.monthStartDay, -1);
      analysisState.drillCategory = null;
      renderAnalysis();
    });
    document.getElementById('periodNext').addEventListener('click', function () {
      var period = getPeriod(analysisState.periodType, analysisState.anchor, state.monthStartDay);
      analysisState.anchor = shiftPeriod(period, analysisState.periodType, state.monthStartDay, 1);
      analysisState.drillCategory = null;
      renderAnalysis();
    });
    var moveToFun = document.getElementById('moveToFunBtn');
    if (moveToFun) moveToFun.addEventListener('click', function () { openMovePanel('toFun'); });
    var moveToBuffer = document.getElementById('moveToBufferBtn');
    if (moveToBuffer) moveToBuffer.addEventListener('click', function () { openMovePanel('toBuffer'); });
    var back = document.getElementById('backToBreakdown');
    if (back) back.addEventListener('click', function () { analysisState.drillCategory = null; renderAnalysis(); });
    document.querySelectorAll('.cat-row').forEach(function (row) {
      row.addEventListener('click', function () { analysisState.drillCategory = row.dataset.cat; renderAnalysis(); });
    });
    document.querySelectorAll('#analysisView .entry-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var entry = state.entries.find(function (e) { return e.id === row.dataset.id; });
        if (entry) openAddPanel(entry);
      });
    });
  }

  function render() {
    var historyView = document.getElementById('historyView');
    var analysisView = document.getElementById('analysisView');
    var analysisBtn = document.getElementById('openAnalysis');

    document.querySelectorAll('#profileSwitch button').forEach(function (btn) {
      var p = btn.dataset.profile;
      btn.textContent = PROFILE_ICONS[p] + ' ' + PROFILE_LABELS[p];
      btn.setAttribute('aria-pressed', p === activeProfile ? 'true' : 'false');
    });

    applySeasonTheme();
    checkBadges();
    updateStreakBadge();

    if (state.view === 'analysis') {
      document.getElementById('todayLabel').textContent = 'Analysis';
      historyView.hidden = true;
      analysisView.hidden = false;
      if (analysisBtn) analysisBtn.classList.add('primary');
      renderAnalysis();
      return;
    }
    historyView.hidden = false;
    analysisView.hidden = true;
    if (analysisBtn) analysisBtn.classList.remove('primary');

    document.getElementById('todayLabel').innerHTML = headerLabel() + holidayLabelSuffix(new Date());
    var todaysTotal = state.entries.filter(function (e) { return e.date === todayKey() && !e.bucket; })
      .reduce(function (sum, e) { return sum + e.amount; }, 0);
    document.getElementById('heroAmount').textContent = formatMoney(todaysTotal);

    var sub = document.getElementById('heroSub');
    var pumpkinEl = document.getElementById('heroPumpkin');
    if (pumpkinEl) {
      if (document.documentElement.getAttribute('data-season') === 'halloween') {
        var overToday = state.allowance !== null && !isNaN(state.allowance) && todaysTotal > state.allowance;
        pumpkinEl.innerHTML = pumpkinSvg(overToday ? 'shocked' : 'happy');
      } else {
        pumpkinEl.innerHTML = '';
      }
    }
    if (state.allowance === null || isNaN(state.allowance)) {
      sub.textContent = 'Set your daily allowance to get started';
      sub.className = 'hero-sub neutral';
    } else {
      var diff = state.allowance - todaysTotal;
      if (diff >= 0) {
        sub.textContent = formatMoney(diff) + ' left of ' + formatMoney(state.allowance) + ' today';
        sub.className = 'hero-sub good';
      } else {
        sub.textContent = formatMoney(Math.abs(diff)) + ' over your ' + formatMoney(state.allowance) + ' today';
        sub.className = 'hero-sub over';
      }
    }

    var history = document.getElementById('history');
    history.innerHTML = '';
    var groups = groupByDay();
    if (groups.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing logged yet. Tap + to add your first expense.';
      history.appendChild(empty);
      return;
    }
    groups.forEach(function (g) {
      var section = document.createElement('div');
      section.className = 'day-group';
      var head = document.createElement('div');
      head.className = 'day-head';
      var name = document.createElement('span');
      name.className = 'day-name';
      name.textContent = dayLabel(g.date);
      head.appendChild(name);
      if (state.allowance !== null && !isNaN(state.allowance)) {
        var diff = document.createElement('span');
        var d = state.allowance - g.total;
        diff.className = 'day-diff ' + (d >= 0 ? 'good' : 'over');
        diff.textContent = d >= 0 ? formatMoney(d) + ' left' : formatMoney(Math.abs(d)) + ' over';
        head.appendChild(diff);
      } else {
        var tot = document.createElement('span');
        tot.className = 'day-diff';
        tot.style.color = 'var(--ink-soft)';
        tot.textContent = formatMoney(g.total);
        head.appendChild(tot);
      }
      section.appendChild(head);
      g.items.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'entry-row';
        row.addEventListener('click', function () { openAddPanel(e); });
        var desc = document.createElement('span');
        desc.className = 'entry-desc';
        desc.textContent = e.description || '(no description)';
        if (e.bucket) {
          var tag = document.createElement('span');
          tag.className = 'entry-bucket-tag';
          tag.textContent = BUCKET_LABELS[e.bucket];
          desc.appendChild(tag);
        }
        if (e.updatedBy) {
          var authorTag = document.createElement('span');
          authorTag.className = 'entry-author-tag';
          authorTag.textContent = authorLabel(e.updatedBy);
          desc.appendChild(authorTag);
        }
        row.appendChild(desc);
        var amt = document.createElement('span');
        amt.className = 'entry-amount mono' + (e.amount < 0 ? ' refund' : '');
        amt.textContent = formatMoney(e.amount);
        row.appendChild(amt);
        var del = document.createElement('button');
        del.className = 'entry-del';
        del.setAttribute('aria-label', 'Delete entry');
        del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>';
        del.addEventListener('click', function (evt) { evt.stopPropagation(); deleteEntry(e.id); });
        row.appendChild(del);
        section.appendChild(row);
      });
      history.appendChild(section);
    });
  }

  function deleteEntry(id) {
    state.entries = state.entries.filter(function (e) { return e.id !== id; });
    state.deletedIds.push({ id: id, deletedAt: Date.now() });
    saveEntries();
    saveDeletedIds();
    render();
    scheduleSync();
  }

  function findDuplicate(candidate, excludeId) {
    return state.entries.find(function (e) {
      if (excludeId && e.id === excludeId) return false;
      return e.date === candidate.date &&
        Math.abs(e.amount - candidate.amount) < 0.005 &&
        (e.description || '').trim().toLowerCase() === (candidate.description || '').trim().toLowerCase();
    });
  }

  function downloadCsv() {
    var rows = state.entries.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.ts - b.ts;
    });
    var lines = ['Date,Description,Amount (SEK),Category,Bucket,By'];
    rows.forEach(function (e) {
      var desc = '"' + String(e.description || '').replace(/"/g, '""') + '"';
      var cat = '"' + String(e.category || UNCATEGORIZED).replace(/"/g, '""') + '"';
      var bucket = e.bucket ? BUCKET_LABELS[e.bucket] : '';
      var by = '"' + String(e.updatedBy || '').replace(/"/g, '""') + '"';
      lines.push(e.date + ',' + desc + ',' + e.amount.toFixed(2) + ',' + cat + ',' + bucket + ',' + by);
    });
    var csv = lines.join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ledger-export-' + todayKey() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

      var date = document.getElementById('dateInput').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) date = todayKey();
      if (isNaN(magnitude) || magnitude === 0) { document.getElementById('amountInput').focus(); return; }
      var amount = Math.round(magnitude * 100) / 100 * (entryType === 'refund' ? -1 : 1);

      if (selectedBucket && !bucketTagAvailable(selectedBucket, amount, date, isEdit, existingEntry)) {
        var warnEl = document.getElementById('bucketTagWarning');
        if (warnEl) warnEl.innerHTML = '<p class="dup-warning">Not enough left in ' + BUCKET_LABELS[selectedBucket] + ' to cover ' + formatMoney(Math.abs(amount)) + '.</p>';

      }

  // ---------------------------------------------------------------
  // Setting up another device: a QR code / link that carries only the
  // Microsoft app Client ID (no login). The QR generator below is small,
  // self-contained and offline (byte mode, error correction level M,
  // versions 1-10).
  // ---------------------------------------------------------------
  var qrEncode = (function () {
    var EXP = [], LOG = [];
    (function () {
      var x = 1, i;
      for (i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; }
      for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
    })();
    function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

    function rsRemainder(data, n) {
      var gen = [1], i, j;
      for (i = 0; i < n; i++) {
        var next = [];
        for (j = 0; j <= gen.length; j++) next.push(0);
        for (j = 0; j < gen.length; j++) { next[j] ^= gen[j]; next[j + 1] ^= gmul(gen[j], EXP[i]); }
        gen = next;
      }
      var res = [];
      for (i = 0; i < n; i++) res.push(0);
      data.forEach(function (b) {
        var factor = b ^ res.shift();
        res.push(0);
        for (var k = 0; k < n; k++) res[k] ^= gmul(gen[k + 1], factor);
      });
      return res;
    }

    // [group blocks as [count, dataCodewordsPerBlock]], EC codewords per block
    var SPECS = [null,

  function setupLink() {
    return window.location.origin + window.location.pathname + '#setup=' + encodeURIComponent(oneDrive.clientId);

  function showClientIdError() {
    var el = document.getElementById('oneDriveClientIdError');

  function applySetupClientId(id, source) {
    if (oneDrive.refreshToken) {
      setupNotice = 'This device is already connected to OneDrive. Tap Disconnect first if you want to use a different Client ID.';
    } else {
      oneDrive.clientId = id;
      saveOneDriveConfig();
      setupNotice = 'Client ID filled in from the setup ' + (source === 'scan' ? 'QR code' : 'link') + '. Tap Connect Microsoft account and sign in with your own Microsoft account.';
    }
    openSettingsPanel();
  }

  function applySetupFromHash() {
    var m = String(window.location.hash || '').match(/[#&]setup=([^&]*)/);
    if (!m) return;
    try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
    var id = null;
    try { id = clientIdFromText(decodeURIComponent(m[1])); } catch (e) {}
    if (!id) return;
    setTimeout(function () { applySetupClientId(id, 'link'); }, 350);
  }

  function stopSetupScanner() {
    if (setupScanner.timer) { clearInterval(setupScanner.timer); setupScanner.timer = null; }
    if (setupScanner.stream) {
      setupScanner.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      setupScanner.stream = null;
    }
    var v = document.getElementById('setupVideo');
    if (v) { try { v.srcObject = null; } catch (e) {} }
  }

    }
    return jsQrLoading;
  }

  async function openSetupScanPanel() {
    panel.innerHTML = '<h2>Scan setup QR</h2>' +
      '<video id="setupVideo" class="setup-video" playsinline muted autoplay></video>' +
      '<p class="hint" id="setupScanHint">Point the camera at the QR code on the other phone.</p>' +
      '<div class="panel-actions"><button class="btn btn-secondary" id="setupScanCancel">Cancel</button></div>';
    showPanel();
    document.getElementById('setupScanCancel').addEventListener('click', function () { stopSetupScanner(); openSettingsPanel(); });
    function hint(text, isErr) {
      var el = document.getElementById('setupScanHint');
      if (el) { el.textContent = text; el.style.color = isErr ? 'var(--over)' : ''; }
    }
    try { await loadJsQr(); } catch (e) {
      hint('Couldn’t load the QR reader. Check your connection, or paste the setup link into the Client ID field instead.', true);
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      hint('This browser can’t use the camera here. Paste the setup link into the Client ID field instead.', true);
      return;
    }
    try {
      setupScanner.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (e) {
      hint('Camera access was denied. Allow the camera for this page, or paste the setup link into the Client ID field instead.', true);
      return;
    }
    var video = document.getElementById('setupVideo');
    if (!video) { stopSetupScanner(); return; }
    video.srcObject = setupScanner.stream;
    try { await video.play(); } catch (e) {}
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    setupScanner.timer = setInterval(function () {
      if (!video.videoWidth || !video.videoHeight) return;
      var scale = Math.min(1, 480 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
      if (!code || !code.data) return;
      var id = clientIdFromText(code.data);
      if (id) { stopSetupScanner(); applySetupClientId(id, 'scan'); }
      else hint('That QR code isn’t a Ledger setup code.', true);
    }, 200);
  }

  function openSetupQrPanel() {
    if (!oneDrive.clientId) return;
    var canInvite = activeProfile === 'shared' && !!oneDrive.refreshToken && !!oneDrive.remoteRef && oneDrive.remoteRef.mode === 'own';
    var link = setupLink();
    var svg = '';
    try { svg = qrSvg(link); } catch (e) {}
    panel.innerHTML = '<h2>Set up another device</h2>' +
      '<p class="scan-intro">On the other phone, open Ledger, go to Settings → OneDrive and tap Scan setup QR. The code only contains the Client ID, never a login, so each person signs in with their own Microsoft account. You can also send the link in a chat.</p>' +
      (canInvite
        ? '<div class="field"><label for="setupInviteEmail">Invite to the shared Ledger (optional)</label>' +
          '<input type="email" id="setupInviteEmail" placeholder="their Microsoft account email" autocomplete="off">' +
          '<button type="button" class="btn btn-secondary" id="setupInviteBtn" style="width:100%;margin-top:8px;">Send OneDrive invite</button>' +
          '<div id="setupInviteStatus" class="hint" style="margin-top:6px;"></div></div>'
        : '<p class="hint">To send the shared-folder invite from here, connect your Microsoft account on the Gemensam profile first. You can also invite under Settings as usual.</p>') +
      '<div class="qr-box">' + svg + '</div>' +
      '<p class="hint" id="setupLinkText" style="word-break:break-all;">' + link.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</p>' +
      '<div class="panel-actions"><button class="btn btn-secondary" id="setupQrBack">Back</button>' +
      '<button class="btn btn-primary" id="setupCopyBtn">Copy setup link</button></div>';
    showPanel();
    document.getElementById('setupQrBack').addEventListener('click', openSettingsPanel);
    document.getElementById('setupCopyBtn').addEventListener('click', function () {
      var btn = this;
      function fallback() {
        var range = document.createRange();
        range.selectNodeContents(document.getElementById('setupLinkText'));
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = 'Select and copy the link';
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () {
          btn.textContent = 'Copied';

        }, fallback);

    var inviteBtn = document.getElementById('setupInviteBtn');
    if (inviteBtn) {
      inviteBtn.addEventListener('click', async function () {
        var email = document.getElementById('setupInviteEmail').value.trim();
        var statusEl = document.getElementById('setupInviteStatus');

        statusEl.textContent = 'Sending invite…';

        } catch (e) {

        }

    }
  }

  // One-tap paste: reads what was copied and goes straight to the review
  // list. If the clipboard can't be read (or holds nothing that looks like
  // expenses) the paste box opens instead, as before.
  async function startPasteFlow() {
    openImportPanel({ noFocus: true });
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      showImportHint('Paste what you copied here, then tap Parse.');
      return;
    }
    var text = '';
    try { text = await navigator.clipboard.readText(); } catch (e) { text = ''; }
    if (!document.getElementById('importText') || currentFlow !== 'import') return;
    text = String(text || '').trim();
    if (!text) {
      showImportHint('Couldn\u2019t read the clipboard. Paste what you copied here, then tap Parse. If you copied a screenshot, use Scan.');
      return;
    }

      document.getElementById('importText').value = text;
      showImportHint('Nothing in what you copied looked like an expense (each line needs an amount). Edit it here or paste again.');
      return;
    }
    runImportParse(text);

  function parseAmount(str) {
    if (!str) return null;
    var s = String(str).replace(/kr/ig, '').trim().replace(/\s/g, '').replace(',', '.');
    if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
    var v = parseFloat(s);
    return isNaN(v) ? null : v;
  }

  function extractDate(str) {
    if (!str) return null;
    var m = String(str).match(/(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[0] : null;
  }

  function parseImportText(text) {
    var lines = String(text || '').split('\n');
    var headerMap = null, sawHeader = false;
    var rows = [];
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      if (/^[\-\s|:]+$/.test(line) && line.indexOf('-') !== -1) return; // markdown separator row

      var cells;
      if (line.indexOf('|') !== -1) {
        cells = line.split('|').map(function (c) { return c.trim(); });
        if (cells.length && cells[0] === '') cells.shift();
        if (cells.length && cells[cells.length - 1] === '') cells.pop();
      } else if (line.indexOf('\t') !== -1) {
        cells = line.split('\t').map(function (c) { return c.trim(); });
      } else {
        cells = line.split(/\s{2,}/).map(function (c) { return c.trim(); });
      }
      cells = cells.map(function (c) { return c.replace(/\*\*/g, '').trim(); });
      if (!cells.length || (cells.length === 1 && !cells[0])) return;

      var joined = cells.join(' ').toLowerCase();
      if (joined.indexOf('total') !== -1 && cells.length <= 2) return;

      var lowerCells = cells.map(function (c) { return c.toLowerCase(); });
      var looksHeader = lowerCells.some(function (c) {
        return c === 'amount' || c === 'merchant' || c === 'description' || c === 'date' || c === 'time' || c === 'status';
      });
      if (!sawHeader && looksHeader) {
        headerMap = {};
        lowerCells.forEach(function (c, i) {
          if (c === 'amount') headerMap.amount = i;
          else if (c === 'merchant' || c === 'description') headerMap.description = i;
          else if (c === 'date') headerMap.date = i;
        });
        sawHeader = true;
        return;
      }

      var amount = null, description = null, date = null;
      if (headerMap && headerMap.amount !== undefined) {
        amount = parseAmount(cells[headerMap.amount]);
        description = headerMap.description !== undefined ? cells[headerMap.description] : null;
        date = headerMap.date !== undefined ? extractDate(cells[headerMap.date]) : null;
      }
      if (amount === null) {
        for (var i = cells.length - 1; i >= 0; i--) {
          var a = parseAmount(cells[i]);
          if (a !== null) { amount = a; break; }
        }
      }
      if (description === null) description = cells[0];
      if (date === null) {
        for (var j = 0; j < cells.length; j++) {
          var d = extractDate(cells[j]);
          if (d) { date = d; break; }
        }
      }
      if (amount === null || amount === 0) return;

      rows.push({
        amount: Math.round(amount * 100) / 100,
        description: (description || '').trim() || '(no description)',
        date: date || todayKey()
      });
    });
    return rows;
  }

  function flagDuplicates() {
    parsedRows.forEach(function (row) {
      var dup = findDuplicate({ date: row.date, amount: row.amount, description: row.description });
      row.duplicate = !!dup;

    });

  function imageFromClipboardData(data) {
    if (!data) return null;
    var files = data.files || [];
    for (var i = 0; i < files.length; i++) if (/^image\//.test(files[i].type)) return files[i];
    var items = data.items || [];
    for (var j = 0; j < items.length; j++) {
      if (items[j].kind === 'file' && /^image\//.test(items[j].type)) return items[j].getAsFile();
    }
    return null;
  }

  function showPasteHint(text, isErr, showZone) {

  async function pasteScreenshotFromClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      showPasteHint('This browser can\u2019t paste with the button. Press and hold in the box below, then choose Paste.', false, true);
      return;
    }
    try {
      var items = await navigator.clipboard.read();
      var hasText = false;
      for (var i = 0; i < items.length; i++) {
        var type = items[i].types.filter(function (t) { return /^image\//.test(t); })[0];
        if (type) {
          var blob = await items[i].getType(type);
          handleScanFile(new File([blob], 'screenshot', { type: blob.type }));
          return;
        }
        if (items[i].types.indexOf('text/plain') !== -1) hasText = true;
      }
      showPasteHint(hasText
        ? 'The clipboard holds text, not a screenshot. To add copied text, tap + and then Paste.'
        : 'No screenshot found on the clipboard. Take a screenshot, tap Copy in its preview, then try again.', true, true);
    } catch (e) {
      showPasteHint('Couldn\u2019t read the clipboard. Press and hold in the box below, then choose Paste.', false, true);
    }
  }

  function errorCopy(code) {
    switch (code) {
      case 'image_rejected': return 'That image couldn\u2019t be read \u2014 try a clearer or smaller screenshot.';
      case 'rate_limited': return 'Too many requests right now \u2014 try again in a bit.';
      case 'invalid_json':
      case 'empty_completion':
      case 'refused': return 'Couldn\u2019t make sense of that screenshot. Try a clearer photo, or add the expense manually.';
      case 'session_expired': return 'You\u2019ll need to sign in again to use this.';
      case 'cancelled': return '';
      default: return 'Something went wrong reading that screenshot. Please try again.';
    }
  }

  // On-device reading of bank screenshots, used when Claude's own reader isn't available (e.g. on GitHub Pages).
  var ocrParseText = (function () {
    var WEEKDAYS = { 'söndag': 0, 'sondag': 0, 'måndag': 1, 'mandag': 1, 'tisdag': 2, 'onsdag': 3, 'torsdag': 4, 'fredag': 5, 'lördag': 6, 'lordag': 6 };
    var MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, maj: 4, jun: 5, jul: 6, aug: 7, sep: 8, okt: 9, nov: 10, dec: 11 };
    var NUM = '(\\d{1,3}(?:[ \\u00a0]\\d{3})+|\\d+)(?:[.,](\\d{1,2}))?\\s*(?:kr|kn|sek|:-)';
    var AMOUNT_RE = new RegExp('(^|[^\\d])([+\\-\\u2212\\u2013])?\\s?' + NUM, 'i');
    var AMOUNT_END_RE = new RegExp('(^|[^\\d])([+\\-\\u2212\\u2013])?\\s?' + NUM + '\\s*[>\\u203a\\u00bb)\\]]*\\s*$', 'i');
    var NOISE_RE = /^(behandlas|apple pay|google pay|månadsfaktura|reserverat|reserverad|swish|kortköp|köp)$/i;
    var TIME_ONLY_RE = /^[\s·•.,-]*\d{1,2}[:.]\d{2}[\s·•.,-]*$/;

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

    function dateFromLine(line, today) {
      var l = line.toLowerCase();
      var m;
      if ((m = l.match(/(\d{4})-(\d{2})-(\d{2})/))) return m[0];
      if (/\bidag\b/.test(l)) return iso(today);
      if (/\bigår\b|\bigar\b/.test(l)) return iso(addDays(today, -1));
      if (/\bf[öo]r\s+\d+\s*(minut|min\b|timm|tim\b|sek)/.test(l)) return iso(today);
      for (var name in WEEKDAYS) {
        if (new RegExp('\\b' + name + '\\b').test(l)) {
          var diff = (today.getDay() - WEEKDAYS[name] + 7) % 7;
          return iso(addDays(today, -(diff === 0 ? 7 : diff)));
        }
      }
      if ((m = l.match(/(\d{1,2})\s+(jan|feb|mar|apr|maj|jun|jul|aug|sep|okt|nov|dec)[a-zåäö]*\.?(?:\s+(\d{4}))?/))) {
        var year = m[3] ? parseInt(m[3], 10) : today.getFullYear();
        var d = new Date(year, MONTHS[m[2]], parseInt(m[1], 10));
        if (!m[3] && d > today) d = new Date(year - 1, MONTHS[m[2]], parseInt(m[1], 10));
        return iso(d);
      }
      return null;
    }

    function readAmount(match) {
      var value = parseFloat(match[3].replace(/[  ]/g, '') + (match[4] ? '.' + match[4] : ''));
      var sign = match[2] || '';
      return { value: sign === '-' || sign === '−' || sign === '–' ? -value : value, income: sign === '+' };
    }

    function cleanDescription(s) {
      return s
        .replace(/[>›»)\]|]+\s*$/, '')
        .replace(/^[^A-Za-zÅÄÖåäöÉéÜü0-9]+/, '')
        .replace(/[\s·•,:;-]+$/, '')
        .trim();
    }

    function letters(s) { return s.replace(/[^A-Za-zÅÄÖåäö]/g, '').length; }

    function stripDateWords(s) {
      return s.replace(/\b(idag|igår|igar)\b/gi, '').replace(AMOUNT_RE, '').replace(/[\s·•.,:;-]+/g, '');
    }

    return function (text, today) {
      var lines = String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      var txs = [], amountOnly = [], descLines = [], dateLines = [];
      var currentDate = null;

      lines.forEach(function (line) {
        var dateHit = dateFromLine(line, today);
        var amtEnd = line.match(AMOUNT_END_RE);
        var amtAny = line.match(AMOUNT_RE);

        if (dateHit && amtAny && stripDateWords(line) === '') { currentDate = dateHit; return; }

        if (amtEnd) {
          var desc = cleanDescription(line.slice(0, amtEnd.index + amtEnd[1].length));
          var amt = readAmount(amtEnd);
          if (letters(desc) < 2) { amountOnly.push(amt); return; }
          txs.push({ description: desc, amount: amt, date: null, inherit: currentDate });
          return;
        }

        if (dateHit) {
          dateLines.push(dateHit);
          var last = txs[txs.length - 1];
          if (last && last.date === null && last.inherit === null) last.date = dateHit;
          else currentDate = dateHit;
          return;
        }

        if (NOISE_RE.test(line) || TIME_ONLY_RE.test(line)) return;
        if (/^[\s·•.,:;-]*\d{1,2}[:.]\d{2}\s*[·•]/.test(line)) return;

        var cleaned = cleanDescription(line);
        if (letters(cleaned) >= 3) descLines.push(cleaned);
      });

      if (txs.length === 0 && amountOnly.length > 0) {
        var n = Math.min(amountOnly.length, descLines.length);
        for (var i = 0; i < n; i++) {
          txs.push({ description: descLines[i], amount: amountOnly[i], date: dateLines.length === n ? dateLines[i] : null, inherit: currentDate });
        }
      }

      return txs
        .filter(function (t) { return !t.amount.income && t.amount.value !== 0; })
        .map(function (t) {
          return { date: t.date || t.inherit || iso(today), description: t.description, amount: Math.round(t.amount.value * 100) / 100 };
        });
    };
  })();

  var TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  var tesseractLoading = null;

  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (!tesseractLoading) {
      tesseractLoading = new Promise(function (resolve, reject) {
        var el = document.createElement('script');
        el.src = TESSERACT_URL;
        el.onload = resolve;
        el.onerror = function () { tesseractLoading = null; reject(new Error('load_failed')); };
        document.head.appendChild(el);
      });
    }
    return tesseractLoading;
  }

  function prepareScanImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(3, Math.max(1, 1800 / img.width));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, c.width, c.height);
        var data = ctx.getImageData(0, 0, c.width, c.height);
        var px = data.data;
        for (var i = 0; i < px.length; i += 4) {
          var g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
          g = Math.max(0, Math.min(255, (g - 128) * 1.35 + 128));
          px[i] = px[i + 1] = px[i + 2] = g;
        }
        ctx.putImageData(data, 0, 0);
        URL.revokeObjectURL(url);
        resolve(c);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image_rejected')); };
      img.src = url;
    });
  }

  async function readScreenshotOnDevice(file) {
    showScanStatus('Preparing the text reader… the first time can take a minute.');
    var worker = null;
    try {
      await loadTesseract();
      var canvas = await prepareScanImage(file);
      worker = await window.Tesseract.createWorker('swe', 1, {
        logger: function (m) {
          if (m && m.status === 'recognizing text') showScanStatus('Reading text… ' + Math.round(m.progress * 100) + '%');
        }
      });
      await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      var result = await worker.recognize(canvas);
      parsedRows = ocrParseText(result.data.text || '', new Date()).map(function (r) {
        return { amount: r.amount, description: r.description, date: r.date, category: null, include: true };
      });
      flagDuplicates();
      renderParsedRows();
    } catch (e) {
      if (e && e.message === 'load_failed') showScanError('Couldn’t load the text reader. Check your connection and try again.');
      else if (e && e.message === 'image_rejected') showScanError(errorCopy('image_rejected'));
      else showScanError('Something went wrong reading that screenshot. Please try again, or add the expenses manually.');
    } finally {
      if (worker) { try { await worker.terminate(); } catch (e2) {} }
    }
  }

  async function handleScanFile(file) {
    if (!file) return;
    if (!sampleFn) { readScreenshotOnDevice(file); return; }
    showScanStatus('Reading screenshot\u2026');
    var prompt = 'This image is a screenshot of a bank or payments app showing a list of transactions, in Swedish kronor (SEK). ' +
      'Extract every purchase AND refund/return (ignore salary, transfers-in, and top-ups). ' +
      'Reply with ONLY a JSON array, one object per transaction: {"amount": number (in SEK, no currency symbol; POSITIVE for a purchase, NEGATIVE for a refund or money returned), ' +
      '"description": string (short merchant or purpose, as shown), "date": string in YYYY-MM-DD format if a date is visible for that transaction, otherwise null}. ' +
      'If nothing qualifies, reply with an empty array [].';
    try {
      var result = await sampleFn.json(prompt, { images: file, modelTier: 'default' });
      if (!Array.isArray(result)) result = [];
      parsedRows = result
        .filter(function (r) { return r && typeof r.amount === 'number' && r.amount !== 0; })
        .map(function (r) {
          var d = (typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) ? r.date : todayKey();
          return {
            amount: Math.round(r.amount * 100) / 100,
            description: typeof r.description === 'string' && r.description.trim() ? r.description.trim() : '(no description)',
            date: d, category: null, include: true
          };
        });
      flagDuplicates();
      renderParsedRows();
    } catch (e) {
      var msg = errorCopy(e && e.code);
      if (msg) showScanError(msg); else closePanel();
    }
  }

  scanFile.addEventListener('change', function () {
    var file = scanFile.files && scanFile.files[0];
    handleScanFile(file);
    scanFile.value = '';
  });

  document.getElementById('openAdd').addEventListener('click', function () { openAddPanel(); });
  document.getElementById('openPaste').addEventListener('click', function () { openScanPanel(); pasteScreenshotFromClipboard(); });
  panel.addEventListener('click', function (ev) { if (ev.target.closest('#introCancel')) closePanel(); });
  document.getElementById('openSettings').addEventListener('click', openSettingsPanel);
  document.getElementById('signInBannerBtn').addEventListener('click', function () { startOneDriveLogin(); });
  document.getElementById('profileSwitch').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-profile]');
    if (btn) switchProfile(btn.dataset.profile);
  });
  document.getElementById('openAnalysis').addEventListener('click', function () {
    state.view = state.view === 'analysis' ? 'history' : 'analysis';
    closePanel();
    render();
  });
  document.getElementById('streakBadge').addEventListener('click', function () {
    var streak = computeStreak();
    var label = streak + (streak === 1 ? ' dags streak' : ' dagars streak');
    var sub = streak > 0 ? 'Fortsätt så!' : 'Logga en dag under budget för att starta en ny streak.';
    openCapybaraLightbox('plain', label, sub, streak === 0);
  });
  document.getElementById('capybaraLightbox').addEventListener('click', function () { this.hidden = true; });

  async function initScanning() {
    try {
      var claudeHost = window.claude;
      if (!claudeHost || typeof claudeHost.use !== 'function') return;
      var s = await claudeHost.use('sample');
      if (!s) return;
      var limits = await s.limits().catch(function () { return null; });
      if (!limits || !limits.images) return;
      sampleFn = s;
    } catch (e) { /* scanning stays hidden */ }
  }

  // ---------------------------------------------------------------
  // First sync after signing in: a clear "connecting" screen instead of an
  // empty list, then what arrived, or what to do if the shared Ledger isn't
  // visible yet.
  // ---------------------------------------------------------------
  var firstSyncActive = false;

  function renderSignInBanner() {
    var el = document.getElementById('signInBanner');
    if (!el) return;
    el.hidden = !(oneDrive.clientId && !oneDrive.refreshToken && oneDrive.signInExpired);
  }

  // At app start only: if the Microsoft sign-in has expired (web-page apps
  // get a fixed 24-hour sign-in), quietly ask Microsoft for a new one. It
  // returns straight away when the phone is still signed in to Microsoft; if
  // not, the banner offers a one-tap sign-in. At most once per 10 minutes so
  // it can never loop.
  function maybeSilentSignIn() {
    if (!oneDrive.clientId || oneDrive.refreshToken || !oneDrive.signInExpired || !oneDrive.autoSignIn) return false;
    if (navigator.onLine === false) return false;
    if (Date.now() - lastSilentAttempt() < 10 * 60 * 1000) return false;
    startOneDriveLogin({ silent: true });
    return true;
  }

  async function startupSync() {
    if (oneDrive.refreshToken) {
      var token = await getOneDriveAccessToken();
      if (token) { syncOneDrive(); return; }
    }
    renderSignInBanner();
    maybeSilentSignIn();
  }

  function runStartupPrompts() {
    if (state.allowance === null || isNaN(state.allowance)) {
      setTimeout(function () { if (state.allowance === null || isNaN(state.allowance)) openSettingsPanel(); }, 300);
    } else {
      var unsettled = findUnsettledPeriod();
      if (unsettled) setTimeout(function () { openSettlementPanel(unsettled); }, 300);
    }
  }

  function showFirstSyncPanel(mode, code) {
    var shared = activeProfile === 'shared';
    var what = shared ? 'shared Ledger' : 'personal list';
    var html = '';
    if (mode === 'syncing') {
      html = '<h2>Connecting…</h2><div class="sync-spinner" role="status" aria-label="Syncing"></div>' +
        '<p class="scan-intro" style="text-align:center;">Getting your ' + what + (shared ? ' and its budget settings' : '') + ' from OneDrive. This takes a few seconds.</p>';
    } else if (mode === 'done') {
      var n = state.entries.length;
      var owner = shared && oneDrive.remoteRef && oneDrive.remoteRef.mode === 'shared' && oneDrive.remoteRef.ownerLabel ? ' from ' + oneDrive.remoteRef.ownerLabel : '';
      html = '<h2>All set</h2><p class="scan-intro">' +
        (n > 0
          ? 'Done. ' + n + (n === 1 ? ' expense' : ' expenses') + (shared ? ' and the shared budget settings' : '') + owner + ' are now on this phone.'
          : 'Connected. The ' + what + ' is empty so far' + (shared ? ' and the shared budget settings' + owner + ' are on this phone' : '') + '.') +
        ' From now on it syncs automatically.</p>' +
        '<div class="panel-actions"><button class="btn btn-primary" id="firstSyncContinue" style="width:100%;">Continue</button></div>';
    } else if (mode === 'noledger') {
      html = '<h2>No shared Ledger yet</h2><p class="scan-intro">You are signed in, but no Ledger has been shared with this Microsoft account yet. Ask the owner to send the invite, accept the email you get, then tap Try again.</p>' +
        '<p class="hint">If you are the owner and this is your first time, you can create the shared Ledger in your own OneDrive instead.</p>' +
        '<div class="panel-actions"><button class="btn btn-secondary" id="firstSyncCreate">Create a new Ledger here</button>' +
        '<button class="btn btn-primary" id="firstSyncRetry">Try again</button></div>' +
        '<button type="button" class="scan-link" id="firstSyncClose" style="justify-content:flex-start;padding-left:0;">Close</button>';
    } else {
      html = '<h2>Couldn’t finish</h2><p class="scan-error">' + friendlyOneDriveError(code || 'sync_failed').replace(/</g, '&lt;') + '</p>' +
        '<div class="panel-actions"><button class="btn btn-secondary" id="firstSyncClose">Close</button>' +
        '<button class="btn btn-primary" id="firstSyncSettings">Open Settings</button></div>';
    }
    panel.innerHTML = html;
    showPanel();
    function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
    on('firstSyncContinue', function () { closePanel(); runStartupPrompts(); });
    on('firstSyncClose', function () { closePanel(); runStartupPrompts(); });
    on('firstSyncSettings', function () { openSettingsPanel(); });
    on('firstSyncRetry', function () { retryFirstSync(false); });
    on('firstSyncCreate', function () { retryFirstSync(true); });
  }

  async function retryFirstSync(allowCreate) {
    if (allowCreate) oneDrive.allowCreate = true;
    showFirstSyncPanel('syncing');
    await syncOneDrive();
    finishFirstSync();
  }

  function finishFirstSync() {
    var err = oneDrive.lastError;
    if (!err) showFirstSyncPanel('done');
    else if (err === 'no_ledger_found') showFirstSyncPanel('noledger');
    else showFirstSyncPanel('error', err);
  }

  // --- init ---
  migrateToProfiles();
  try {
    var storedProfile = localStorage.getItem(ACTIVE_PROFILE_KEY);
    if (storedProfile && PROFILES.indexOf(storedProfile) !== -1) activeProfile = storedProfile;
  } catch (e) {}
  loadState();
  render();
  applySetupFromHash();
  firstSyncActive = /[?&](code|error)=/.test(window.location.search) && !!oneDrive.clientId &&
    Date.now() - lastSilentAttempt() >= 120000 &&
    !(activeProfile === 'shared' ? oneDrive.lastSyncedAt : oneDrive.personalLastSyncedAt);
  if (firstSyncActive) showFirstSyncPanel('syncing');
  else runStartupPrompts();
  initScanning();
  handleOneDriveRedirect().then(function (handledRedirect) {
    if (firstSyncActive) { firstSyncActive = false; finishFirstSync(); }
    else if (!handledRedirect) startupSync();
    renderSignInBanner();
  });
  setInterval(function () {
    if (document.visibilityState === 'visible') syncOneDrive();
  }, 120000);
})();
</script>
</body>
</html>
