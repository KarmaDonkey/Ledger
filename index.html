<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDE8DC;
    --surface: #E4DDCB;
    --surface-2: #DCD4BF;
    --ink: #2A2620;
    --ink-soft: #6B6250;
    --ink-faint: #8E846E;
    --accent: #96721C;
    --good: #4B6B45;
    --over: #8C3B32;
    --hairline: rgba(42, 38, 32, 0.14);
    --shadow: rgba(42, 38, 32, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1917;
      --surface: #242220;
      --surface-2: #2C2A26;
      --ink: #EDE6D8;
      --ink-soft: #A69C89;
      --ink-faint: #7A7263;
      --accent: #C9A227;
      --good: #7FA36E;
      --over: #C06256;
      --hairline: rgba(237, 230, 216, 0.12);
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1917;
    --surface: #242220;
    --surface-2: #2C2A26;
    --ink: #EDE6D8;
    --ink-soft: #A69C89;
    --ink-faint: #7A7263;
    --accent: #C9A227;
    --good: #7FA36E;
    --over: #C06256;
    --hairline: rgba(237, 230, 216, 0.12);
    --shadow: rgba(0, 0, 0, 0.4);
  }

  /* ---- Seasonal themes (auto-applied by date, see applySeasonTheme) ---- */
  :root[data-season="halloween"] {
    --bg: #33200F;
    --surface: #3D2814;
    --surface-2: #4A311C;
    --ink: #F7E9D7;
    --ink-soft: #D3AE83;
    --ink-faint: #A98A61;
    --accent: #E8730A;
    --good: #9CBB6B;
    --over: #D9694C;
    --hairline: rgba(247, 233, 215, 0.14);
    --shadow: rgba(20, 10, 5, 0.4);
  }
  :root[data-season="december"] {
    --bg: #FAF6F0;
    --surface: #F3ECE3;
    --surface-2: #EDE2D6;
    --ink: #2A2620;
    --ink-soft: #8A7A6E;
    --ink-faint: #A99C8D;
    --accent: #C0392B;
    --good: #2F6E4F;
    --over: #942F22;
    --hairline: rgba(42, 38, 32, 0.12);
    --shadow: rgba(120, 100, 80, 0.18);
  }
  :root[data-season="summer"] {
    --bg: #FFF3D6;
    --surface: #FCEAC2;
    --surface-2: #F7DFA8;
    --ink: #3A2A12;
    --ink-soft: #7A5B2E;
    --ink-faint: #9C8055;
    --accent: #FF6F3C;
    --good: #2F8F79;
    --over: #C0392B;
    --hairline: rgba(58, 42, 18, 0.12);
    --shadow: rgba(90, 60, 10, 0.22);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100%;
  }
  body { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .page {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    z-index: 0;
  }

  /* ---- Seasonal decoration: a subtle glow + scattered accents behind
     the header/hero, negative z-index so it never sits above content ---- */
  :root[data-season="halloween"] .page::before,
  :root[data-season="halloween"] .page::after,
  :root[data-season="december"] .page::before,
  :root[data-season="december"] .page::after {
    content: '';
    position: absolute;
    z-index: -1;
    pointer-events: none;
  }
  :root[data-season="halloween"] .page::before {
    top: 0; left: 0; right: 0; height: 230px;
    background:
      radial-gradient(circle at 82% 8%, rgba(232, 115, 10, 0.5) 0 4px, transparent 5px),
      radial-gradient(circle at 66% 24%, rgba(201, 138, 58, 0.45) 0 3px, transparent 4px),
      radial-gradient(circle at 12% 18%, rgba(232, 115, 10, 0.35) 0 3px, transparent 4px),
      radial-gradient(circle at 30% 42%, rgba(160, 110, 40, 0.35) 0 3px, transparent 4px),
      radial-gradient(circle at 90% 48%, rgba(232, 115, 10, 0.3) 0 3px, transparent 4px),
      radial-gradient(circle at 78% 12%, rgba(232, 115, 10, 0.35), transparent 48%);
  }
  :root[data-season="halloween"] .page::after {
    top: 64px; right: 20px; width: 34px; height: 27px;
    background:
      radial-gradient(ellipse 2.5px 5px at 50% 10%, #4E3418 0%, #4E3418 85%, transparent 86%),
      radial-gradient(ellipse 16px 12px at 50% 62%, #F09030 0%, #E8730A 65%, transparent 66%);
  }
  :root[data-season="december"] .page::before {
    top: 0; left: 0; right: 0; height: 230px;
    background:
      radial-gradient(circle at 50% 4%, rgba(192, 57, 43, 0.12), transparent 42%),
      radial-gradient(circle at 14% 14%, #C0392B 0 2.5px, transparent 3.5px),
      radial-gradient(ellipse 2px 3px at 17% 10%, #2F6E4F 0%, #2F6E4F 85%, transparent 86%),
      radial-gradient(circle at 82% 30%, #C0392B 0 2.5px, transparent 3.5px),
      radial-gradient(ellipse 2px 3px at 85% 26%, #2F6E4F 0%, #2F6E4F 85%, transparent 86%),
      radial-gradient(circle at 60% 12%, #C0392B 0 2px, transparent 3px);
  }
  :root[data-season="december"] .page::after {
    top: 64px; left: 18px; right: 18px; height: 1px;
    background: repeating-linear-gradient(90deg, #C0392B 0 8px, #2F6E4F 8px 16px, transparent 16px 20px);
  }

  /* ---- Header ---- */
  header {
    padding: max(20px, env(safe-area-inset-top)) 20px 4px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .date-label { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; margin: 0; }
  .profile-row { padding: 6px 20px 10px; }
  .profile-switch {
    display: flex; gap: 2px; padding: 2px; border-radius: 22px; background: var(--surface-2);
  }
  .profile-switch button {
    flex: 1; border: none; background: transparent; color: var(--ink-soft); font: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 10px; min-height: 36px; border-radius: 20px; cursor: pointer; white-space: nowrap;
  }
  .profile-switch button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .header-actions { display: flex; gap: 6px; margin: -6px -6px 0 0; }
  .icon-btn {
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    color: var(--ink-soft);
    border-radius: 8px;
    display: flex;
  }
  .icon-btn:active { background: var(--hairline); }
  @media (max-width: 380px) { .header-actions { gap: 2px; } .header-actions .icon-btn { padding: 6px; } }
  .add-tabs { display: flex; gap: 2px; padding: 2px; border-radius: 22px; background: var(--surface-2); margin: 0 0 14px; }
  .add-tabs button {
    flex: 1; border: none; background: transparent; color: var(--ink-soft); font: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 10px; min-height: 36px; border-radius: 20px; cursor: pointer;
  }
  .add-tabs button.active { background: var(--accent); color: var(--bg); }
  .icon-btn svg { width: 20px; height: 20px; display: block; }
  .icon-btn.primary { color: var(--accent); }

  /* ---- Panel (replaces the old bottom sheets — sits in normal flow, always reachable) ---- */
  .panel {
    margin: 0 20px 18px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 16px 16px 14px;
  }
  .panel[hidden] { display: none; }
  .panel h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 14px;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 17px;
    color: var(--ink);
    font-family: inherit;
  }
  .field input.mono-input { font-family: 'IBM Plex Mono', monospace; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
  .diag-divider { border-top: 1px solid var(--hairline); margin: 16px 0 14px; }
  .diag-block p.hint { font-size: 12.5px; line-height: 1.5; }

  .panel-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--ink-soft); }
  .btn:active { opacity: 0.8; }

  .scan-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    background: none;
    border: none;
    padding: 12px 0 2px;
    margin-top: 4px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .scan-link svg { width: 15px; height: 15px; }
  .scan-link:active { opacity: 0.7; }

  .scan-intro { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 14px; }
  .scan-upload {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px dashed var(--ink-faint);
    border-radius: 12px;
    padding: 22px 14px;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
  }
  .scan-upload svg { width: 18px; height: 18px; }
  .scan-upload + .scan-upload { margin-top: 10px; }
  .scan-upload.scan-upload-primary { border-style: solid; border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .sync-spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--hairline); border-top-color: var(--accent); margin: 14px auto; animation: ledger-spin 0.9s linear infinite; }
  @keyframes ledger-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sync-spinner { animation: none; } }
  .auto-signin { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 12px; }
  .auto-signin input { width: 18px; height: 18px; accent-color: var(--accent); }
  .setup-video { width: 100%; max-height: 50vh; border-radius: 12px; background: #000; object-fit: cover; display: block; margin-bottom: 8px; }
  .qr-box { background: #fff; border-radius: 12px; padding: 8px; width: 100%; max-width: 260px; margin: 12px auto; }
  .qr-box svg { display: block; width: 100%; height: auto; }
  .scan-hint { font-size: 13px; color: var(--ink-soft); line-height: 1.45; margin: 10px 0 0; }
  .scan-hint.scan-hint-err { color: var(--over); }
  .scan-paste-zone {
    margin-top: 10px; min-height: 64px; padding: 14px; border: 1px dashed var(--ink-faint); border-radius: 12px;
    font-size: 14px; color: var(--ink); overflow: hidden; -webkit-user-select: text; user-select: text;
  }
  .scan-paste-zone:empty::before { content: attr(data-placeholder); color: var(--ink-soft); }
  .scan-status { font-size: 14px; color: var(--ink-soft); text-align: center; padding: 14px 0; }
  .scan-rows { max-height: 44vh; overflow-y: auto; margin: 4px 0 14px; }
  .scan-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--hairline); }
  .scan-row:last-child { border-bottom: none; }
  .scan-row input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--accent); }
  .scan-row .scan-desc {
    flex: 1; min-width: 0;
    background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .scan-row .scan-amt {
    width: 80px; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; font-family: 'IBM Plex Mono', monospace; color: var(--ink); text-align: right;
  }
  .scan-error { font-size: 13px; color: var(--over); margin: 0 0 12px; }

  .import-textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--ink);
    font-family: inherit;
    resize: vertical;
    min-height: 110px;
  }
  .import-textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .type-toggle { display: flex; gap: 8px; }
  .type-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--hairline);
    background: var(--surface-2);
    color: var(--ink-soft);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .type-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .dup-warning {
    font-size: 13px;
    color: var(--over);
    background: color-mix(in srgb, var(--over) 12%, transparent);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 0 12px;
    line-height: 1.4;
  }

  .entry-amount.refund { color: var(--good); }

  .scan-row.scan-row-dup { background: color-mix(in srgb, var(--over) 8%, transparent); border-radius: 8px; }
  .dup-note { font-size: 12px; color: var(--over); padding: 0 0 9px 28px; margin-top: -5px; }

  /* ---- Hero ---- */
  .signin-banner { margin: 0 20px 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink-soft); }
  .signin-banner[hidden] { display: none; }
  .signin-banner .btn { flex-shrink: 0; padding: 8px 14px; white-space: nowrap; }
  .hero { padding: 4px 20px 20px; border-bottom: 1px solid var(--hairline); position: relative; }
  .hero > * { position: relative; z-index: 1; }
  .hero > .hero-pumpkin { position: absolute; z-index: 0; display: none; pointer-events: none; }
  :root[data-season="halloween"] .hero > .hero-pumpkin { display: block; top: -6px; right: 16px; width: 84px; height: 84px; }
  :root[data-season="halloween"] .hero-amount,
  :root[data-season="halloween"] .hero-sub { max-width: calc(100% - 92px); }
  .hero-pumpkin svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pumpkin-glow { animation: pumpkin-flicker 3.4s ease-in-out infinite; }
  @keyframes pumpkin-flicker { 0%, 100% { opacity: 0.75; } 20% { opacity: 0.55; } 38% { opacity: 0.95; } 55% { opacity: 0.6; } 78% { opacity: 0.88; } }
  @media (prefers-reduced-motion: reduce) { .pumpkin-glow { animation: none; opacity: 0.75; } }
  @media (max-width: 380px) {
    :root[data-season="halloween"] .hero > .hero-pumpkin { width: 68px; height: 68px; right: 12px; }
    :root[data-season="halloween"] .hero-amount,
    :root[data-season="halloween"] .hero-sub { max-width: calc(100% - 76px); }
  }
  @media (max-width: 339px) {
    :root[data-season="halloween"] .hero > .hero-pumpkin { display: none; }
    :root[data-season="halloween"] .hero-amount,
    :root[data-season="halloween"] .hero-sub { max-width: none; }
  }
  .hero-amount {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .hero-sub { margin: 6px 0 0; font-size: 15px; font-weight: 500; }
  .hero-sub.good { color: var(--good); }
  .hero-sub.over { color: var(--over); }
  .hero-sub.neutral { color: var(--ink-faint); }

  /* ---- History ---- */
  .history { padding: 8px 20px 60px; }
  .day-group { margin-top: 22px; }
  .day-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 8px; border-bottom: 1px solid var(--hairline); margin-bottom: 2px;
  }
  .day-name { font-size: 14px; font-weight: 500; color: var(--ink-soft); }
  .day-diff {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500;
    padding: 2px 8px; border-radius: 20px;
  }
  .day-diff.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .day-diff.over { color: var(--over); background: color-mix(in srgb, var(--over) 14%, transparent); }

  .entry-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); cursor: pointer; }
  .entry-row:active { background: var(--surface); }
  .entry-row:last-child { border-bottom: none; }
  .entry-desc { flex: 1; font-size: 15px; min-width: 0; overflow-wrap: break-word; }
  .entry-amount { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; white-space: nowrap; }
  .entry-del { background: none; border: none; padding: 4px; color: var(--ink-faint); opacity: 0.55; cursor: pointer; flex-shrink: 0; }
  .entry-del:active { opacity: 1; }
  .entry-del svg { width: 15px; height: 15px; display: block; }

  .empty-state { margin-top: 40px; text-align: center; color: var(--ink-faint); font-size: 14px; line-height: 1.5; padding: 0 30px; }

  /* ---- Analysis ---- */
  .analysis { padding: 8px 20px 60px; }
  .period-nav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 4px; }
  .period-nav .icon-btn { padding: 6px 10px; font-size: 20px; line-height: 1; }
  .period-label { font-size: 14px; font-weight: 500; color: var(--ink-soft); text-align: center; flex: 1; }

  .trend-chart { margin: 4px 0 20px; padding: 12px 14px; background: var(--surface); border-radius: 12px; }

  .cat-breakdown { margin-top: 6px; }
  .cat-row { padding: 12px 0; border-bottom: 1px solid var(--hairline); cursor: pointer; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; }
  .cat-name { font-size: 15px; }
  .cat-amt { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .cat-bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .cat-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }

  .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-chip {
    padding: 8px 12px; border-radius: 20px; border: 1px solid var(--hairline);
    background: var(--surface-2); color: var(--ink-soft); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .cat-chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .cat-manage-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .cat-manage-input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 10px; font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .cat-manage-del { background: none; border: none; color: var(--ink-faint); font-size: 20px; line-height: 1; padding: 4px 8px; cursor: pointer; }
  .cat-add-row { display: flex; gap: 8px; margin-top: 4px; }
  .cat-add-row input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 10px; font-size: 14px; color: var(--ink); font-family: inherit;
  }

  .scan-row-cat { padding: 0 0 9px 28px; margin-top: -5px; }
  .scan-row-cat select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 6px 8px; font-size: 13px; color: var(--ink); font-family: inherit;
  }
  .version-line { font-size: 12px; color: var(--ink-faint); text-align: center; margin: 18px 0 0; }

  /* ---- Streak, savings goal, badges ---- */
  .streak-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 4px 10px; border-radius: 20px; background: var(--surface-2); color: var(--ink-soft);
    font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: inherit;
  }
  .streak-badge .capybara-icon { flex-shrink: 0; }

  .goal-block { margin: 4px 0 18px; }
  .cat-bar-fill.over { background: var(--over); }

  .bucket-row { display: flex; gap: 12px; }
  .bucket-card {
    flex: 1; background: var(--surface-2); border-radius: 12px; padding: 12px 14px;
  }
  .bucket-card { display: flex; flex-direction: column; }
  .bucket-move { margin-top: auto; padding-top: 8px; }
  .bucket-card-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .bucket-card-amt { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; margin-bottom: 6px; }
  .bucket-card-amt.good { color: var(--good); }
  .bucket-card-amt.over { color: var(--over); }

  .entry-bucket-tag {
    display: inline-block; font-size: 10px; font-weight: 500; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
  }
  .entry-author-tag {
    display: inline-block; font-size: 10px; font-weight: 500; color: var(--ink-soft);
    background: var(--surface-2);
    border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
  }

  .bucket-cashout-row { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .bucket-cashout-row:last-child { border-bottom: none; }
  .cashout-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .cashout-desc { font-size: 14px; }
  .cashout-amt { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }

  .badge-row { display: flex; gap: 12px; }
  .badge-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.3; cursor: pointer;
  }
  .badge-item.badge-locked { opacity: 0.32; }

  @keyframes capybara-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(-1.5deg); }
  }
  .capybara-animated { animation: capybara-bob 2.4s ease-in-out infinite; }

  .capybara-lightbox {
    position: fixed; inset: 0; background: rgba(20, 17, 12, 0.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px;
  }
  .capybara-lightbox[hidden] { display: none; }
  .capybara-lightbox-card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
    padding: 28px 26px 22px; text-align: center; max-width: 280px;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35);
  }
  .capybara-lightbox-card svg { width: 200px; height: auto; }
  .capybara-lightbox-card p { margin: 14px 0 0; font-size: 16px; font-weight: 600; color: var(--ink); font-family: 'Source Serif 4', Georgia, serif; }
  .capybara-lightbox-card p.hint { margin-top: 6px; font-size: 13px; font-weight: 400; font-family: inherit; }
</style>

<script>
(function () {
  // Profiles: two fully independent copies of the app's data (own budget,
  // entries, streak, buckets, badges, categories), switched via a pill in
  // the header. Only the "shared" profile ever syncs to OneDrive.
  var PROFILES = ['shared', 'personal'];
  var PROFILE_LABELS = { shared: 'Gemensam', personal: 'Personlig' };
  var PROFILE_ICONS = { shared: '🏠', personal: '👤' };
  var ACTIVE_PROFILE_KEY = 'ledger.activeProfile.v1';
  var PROFILE_MIGRATION_KEY = 'ledger.profileMigrationV1.v1';
  var activeProfile = 'shared';
  var profileEpoch = 0;

  function profileKey(name) { return 'ledger.' + activeProfile + '.' + name + '.v1'; }
  function STORE_KEY() { return profileKey('entries'); }
  function ALLOWANCE_KEY() { return profileKey('allowance'); }
  function LAST_SAVED_KEY() { return profileKey('lastSaved'); }
  function CATEGORIES_KEY() { return profileKey('categories'); }
  function MONTH_START_KEY() { return profileKey('monthStartDay'); }
  function BUCKETS_KEY() { return profileKey('buckets'); }
  function BADGES_KEY() { return profileKey('badges'); }
  function DELETED_IDS_KEY() { return profileKey('deletedIds'); }
  function CATEGORY_MIGRATION_KEY() { return profileKey('categoriesMigrationV2'); }
  function BUCKET_MODEL_MIGRATION_KEY() { return profileKey('bucketModelMigrationV2'); }
  function SETTINGS_META_KEY() { return profileKey('settingsMeta'); }
  var ONEDRIVE_KEY = 'ledger.onedrive.v1';

  // One-time migration: before profiles existed, everything lived under
  // flat (non-namespaced) keys. That data becomes the "shared" profile.
  function migrateToProfiles() {
    try {
      if (localStorage.getItem(PROFILE_MIGRATION_KEY)) return;
      var pairs = [
        ['ledger.entries.v1', 'ledger.shared.entries.v1'],
        ['ledger.allowance.v1', 'ledger.shared.allowance.v1'],
        ['ledger.lastSaved.v1', 'ledger.shared.lastSaved.v1'],
        ['ledger.categories.v1', 'ledger.shared.categories.v1'],
        ['ledger.monthStartDay.v1', 'ledger.shared.monthStartDay.v1'],
        ['ledger.buckets.v1', 'ledger.shared.buckets.v1'],
        ['ledger.badges.v1', 'ledger.shared.badges.v1'],
        ['ledger.deletedIds.v1', 'ledger.shared.deletedIds.v1'],
        ['ledger.categoriesMigrationV2.v1', 'ledger.shared.categoriesMigrationV2.v1']
      ];
      pairs.forEach(function (pair) {
        var oldVal = localStorage.getItem(pair[0]);
        if (oldVal !== null && localStorage.getItem(pair[1]) === null) {
          localStorage.setItem(pair[1], oldVal);
        }
      });
      localStorage.setItem(PROFILE_MIGRATION_KEY, '1');
    } catch (e) {}
  }
  var NEW_CATEGORIES_V2 = ['Take-away', 'Fika', 'Kläder'];
  var DEFAULT_CATEGORIES = ['Mat', 'Transport', 'Nöje', 'Räkningar', 'Övrigt', 'Take-away', 'Fika', 'Kläder'];
  var UNCATEGORIZED = 'Okategoriserad';
  var BUCKET_LABELS = { planned: 'Planned', fun: 'Fun' };
  var FUN_MILESTONES = [20, 40, 60, 80, 100];
  function funMilestoneBadgeId(pct) { return 'funMilestone' + pct; }
  function funMilestoneVariant(pct) {
    if (pct >= 100) return 'crown';
    if (pct >= 60) return 'sunglasses';
    return 'plain';
  }
  var APP_VERSION = '3.13';
  var state = {
    entries: [], allowance: null, categories: [], monthStartDay: 1, view: 'history',
    buckets: { trackingStart: null, funTarget: null, funNote: '', settlements: [], transfers: [] }, badges: [],
    deletedIds: [], settingsMeta: { allowance: 0, monthStartDay: 0, fun: 0, categories: 0 }
  };
  // Shared with (OneDrive): clientId/refreshToken/remoteRef/lastSyncedAt/lastEtag/accountLabel
  // persist to ONEDRIVE_KEY; accessToken/accessTokenExpiry/syncing/lastError are runtime-only.
  var oneDrive = {
    clientId: null, refreshToken: null, remoteRef: null, lastSyncedAt: null, lastEtag: null, accountLabel: null,
    personalRef: null, personalLastSyncedAt: null, allowCreate: false,
    signInExpired: false, autoSignIn: true,
    accessToken: null, accessTokenExpiry: 0, syncing: false, lastError: null
  };
  var storageStatus = { ok: null, lastSaved: null };
  var analysisState = { periodType: 'month', anchor: new Date(), mode: 'total', drillCategory: null };

  function storageSelfTest() {
    try {
      var testKey = 'ledger.selftest.v1';
      localStorage.setItem(testKey, 'x');
      var ok = localStorage.getItem(testKey) === 'x';
      localStorage.removeItem(testKey);
      return ok;
    } catch (e) { return false; }
  }

  function isStandalone() {
    return (window.navigator && window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }

  // One-time migration from the old two-bucket model (Everyday target +
  // indefinite tracking pool) to the period-buffer model: old "everyday"
  // cash-outs become "planned purchases"; the old Fun balance (computed
  // with the pre-migration formula, using data that's about to be
  // replaced) is preserved as a seed credit in the new settlements list.
  function migrateBucketsToPeriodModel() {
    var old = state.buckets || {};
    var oldFunBalance = 0;
    if (state.allowance !== null && !isNaN(state.allowance) && old.trackingStart) {
      var start = old.trackingStart, end = todayKey();
      var untaggedSpent = state.entries
        .filter(function (e) { return e.date >= start && e.date <= end && !e.bucket; })
        .reduce(function (s, e) { return s + e.amount; }, 0);
      var days = Math.max(0, Math.round((new Date(end + 'T00:00:00') - new Date(start + 'T00:00:00')) / 86400000) + 1);
      var pool = state.allowance * days - untaggedSpent;
      var oldTarget = old.everydayTarget;
      var effectiveTarget = (oldTarget !== null && oldTarget !== undefined && !isNaN(oldTarget) && oldTarget > 0) ? oldTarget : 0;
      var funShare = Math.max(0, pool - effectiveTarget);
      var funCashedOut = state.entries.filter(function (e) { return e.bucket === 'fun'; })
        .reduce(function (s, e) { return s + e.amount; }, 0);
      oldFunBalance = funShare - funCashedOut;
    }
    state.entries.forEach(function (e) { if (e.bucket === 'everyday') e.bucket = 'planned'; });
    state.buckets = {
      trackingStart: old.trackingStart || null,
      funTarget: old.funTarget !== undefined ? old.funTarget : null,
      funNote: old.funNote || '',
      settlements: oldFunBalance > 0.005
        ? [{ periodKey: '__migration__', bufferAtEnd: 0, takenFromFun: 0, toFun: oldFunBalance, carryToNext: 0, settledAt: Date.now() }]
        : []
    };
    saveBuckets();
    saveEntries();
  }

  function loadState() {
    try {
      var rawEntries = localStorage.getItem(STORE_KEY());
      state.entries = rawEntries ? JSON.parse(rawEntries) : [];
    } catch (e) { state.entries = []; }
    try {
      var rawAllowance = localStorage.getItem(ALLOWANCE_KEY());
      state.allowance = rawAllowance !== null ? parseFloat(rawAllowance) : null;
    } catch (e) { state.allowance = null; }
    try {
      var rawLastSaved = localStorage.getItem(LAST_SAVED_KEY());
      storageStatus.lastSaved = rawLastSaved ? parseInt(rawLastSaved, 10) : null;
    } catch (e) { storageStatus.lastSaved = null; }
    try {
      var rawCats = localStorage.getItem(CATEGORIES_KEY());
      state.categories = rawCats ? JSON.parse(rawCats) : DEFAULT_CATEGORIES.slice();
    } catch (e) { state.categories = DEFAULT_CATEGORIES.slice(); }
    try {
      var rawStart = localStorage.getItem(MONTH_START_KEY());
      state.monthStartDay = rawStart !== null ? parseInt(rawStart, 10) : 1;
      if (isNaN(state.monthStartDay) || state.monthStartDay < 1 || state.monthStartDay > 31) state.monthStartDay = 1;
    } catch (e) { state.monthStartDay = 1; }
    try {
      var rawBuckets = localStorage.getItem(BUCKETS_KEY());
      state.buckets = rawBuckets ? JSON.parse(rawBuckets) : { trackingStart: null, funTarget: null, funNote: '', settlements: [], transfers: [] };
    } catch (e) { state.buckets = { trackingStart: null, funTarget: null, funNote: '', settlements: [], transfers: [] }; }
    try {
      if (!localStorage.getItem(BUCKET_MODEL_MIGRATION_KEY())) {
        migrateBucketsToPeriodModel();
        localStorage.setItem(BUCKET_MODEL_MIGRATION_KEY(), '1');
      }
    } catch (e) {}
    if (state.buckets.funTarget === undefined) state.buckets.funTarget = null;
    if (state.buckets.funNote === undefined) state.buckets.funNote = '';
    if (!state.buckets.settlements) state.buckets.settlements = [];
    if (!Array.isArray(state.buckets.transfers)) state.buckets.transfers = [];
    try {
      var rawBadges = localStorage.getItem(BADGES_KEY());
      state.badges = rawBadges ? JSON.parse(rawBadges) : [];
    } catch (e) { state.badges = []; }
    try {
      var rawDeleted = localStorage.getItem(DELETED_IDS_KEY());
      state.deletedIds = rawDeleted ? JSON.parse(rawDeleted) : [];
    } catch (e) { state.deletedIds = []; }
    try {
      var rawOneDrive = localStorage.getItem(ONEDRIVE_KEY);
      var od = rawOneDrive ? JSON.parse(rawOneDrive) : null;
      if (od) {
        oneDrive.clientId = od.clientId || null;
        oneDrive.refreshToken = od.refreshToken || null;
        oneDrive.remoteRef = od.remoteRef || null;
        oneDrive.lastSyncedAt = od.lastSyncedAt || null;
        oneDrive.lastEtag = od.lastEtag || null;
        oneDrive.personalRef = od.personalRef || null;
        oneDrive.signInExpired = od.signInExpired === true;
        oneDrive.autoSignIn = od.autoSignIn !== false;
        oneDrive.personalLastSyncedAt = od.personalLastSyncedAt || null;
        oneDrive.accountLabel = od.accountLabel || null;
      }
    } catch (e) {}
    try {
      if (!localStorage.getItem(CATEGORY_MIGRATION_KEY())) {
        var addedNewCategory = false;
        NEW_CATEGORIES_V2.forEach(function (c) {
          if (state.categories.indexOf(c) === -1) { state.categories.push(c); addedNewCategory = true; }
        });
        localStorage.setItem(CATEGORY_MIGRATION_KEY(), '1');
        if (addedNewCategory) saveCategories();
      }
    } catch (e) {}
    try {
      var rawMeta = localStorage.getItem(SETTINGS_META_KEY());
      if (rawMeta) {
        var parsedMeta = JSON.parse(rawMeta);
        ['allowance', 'monthStartDay', 'fun', 'categories'].forEach(function (f) {
          state.settingsMeta[f] = typeof parsedMeta[f] === 'number' ? parsedMeta[f] : 0;
        });
      } else {
        // First run with settings sync: values that were already customised count as edited now,
        // untouched defaults stay at 0 so a synced value can replace them.
        var nowStamp = Date.now();
        state.settingsMeta = {
          allowance: (state.allowance !== null && !isNaN(state.allowance)) ? nowStamp : 0,
          monthStartDay: state.monthStartDay !== 1 ? nowStamp : 0,
          fun: (state.buckets.funTarget !== null || state.buckets.funNote) ? nowStamp : 0,
          categories: state.categories.slice().sort().join('|') !== DEFAULT_CATEGORIES.slice().sort().join('|') ? nowStamp : 0
        };
        saveSettingsMeta();
      }
    } catch (e) {}
    storageStatus.ok = storageSelfTest();
  }
  function saveEntries() {
    try {
      localStorage.setItem(STORE_KEY(), JSON.stringify(state.entries));
      storageStatus.ok = true;
      storageStatus.lastSaved = Date.now();
      try { localStorage.setItem(LAST_SAVED_KEY(), String(storageStatus.lastSaved)); } catch (e2) {}
    } catch (e) { storageStatus.ok = false; }
  }

  function saveAllowance() {
    try {
      localStorage.setItem(ALLOWANCE_KEY(), String(state.allowance));
      storageStatus.ok = true;
      storageStatus.lastSaved = Date.now();
      try { localStorage.setItem(LAST_SAVED_KEY(), String(storageStatus.lastSaved)); } catch (e2) {}
    } catch (e) { storageStatus.ok = false; }
  }

  function saveCategories() {
    try {
      localStorage.setItem(CATEGORIES_KEY(), JSON.stringify(state.categories));
      storageStatus.ok = true;
      storageStatus.lastSaved = Date.now();
      try { localStorage.setItem(LAST_SAVED_KEY(), String(storageStatus.lastSaved)); } catch (e2) {}
    } catch (e) { storageStatus.ok = false; }
  }

  function saveMonthStartDay() {
    try {
      localStorage.setItem(MONTH_START_KEY(), String(state.monthStartDay));
      storageStatus.ok = true;
      storageStatus.lastSaved = Date.now();
      try { localStorage.setItem(LAST_SAVED_KEY(), String(storageStatus.lastSaved)); } catch (e2) {}
    } catch (e) { storageStatus.ok = false; }
  }

  function saveBuckets() {
    try {
      localStorage.setItem(BUCKETS_KEY(), JSON.stringify(state.buckets));
      storageStatus.ok = true;
      storageStatus.lastSaved = Date.now();
      try { localStorage.setItem(LAST_SAVED_KEY(), String(storageStatus.lastSaved)); } catch (e2) {}
    } catch (e) { storageStatus.ok = false; }
  }

  function saveBadges() {
    try {
      localStorage.setItem(BADGES_KEY(), JSON.stringify(state.badges));
      storageStatus.ok = true;
      storageStatus.lastSaved = Date.now();
      try { localStorage.setItem(LAST_SAVED_KEY(), String(storageStatus.lastSaved)); } catch (e2) {}
    } catch (e) { storageStatus.ok = false; }
  }

  function saveSettingsMeta() {
    try { localStorage.setItem(SETTINGS_META_KEY(), JSON.stringify(state.settingsMeta)); } catch (e) {}
  }

  function touchSetting(field) {
    state.settingsMeta[field] = Date.now();
    saveSettingsMeta();
  }

  function saveDeletedIds() {
    try { localStorage.setItem(DELETED_IDS_KEY(), JSON.stringify(state.deletedIds)); } catch (e) {}
  }

  function saveOneDriveConfig() {
    try {
      localStorage.setItem(ONEDRIVE_KEY, JSON.stringify({
        clientId: oneDrive.clientId,
        refreshToken: oneDrive.refreshToken,
        remoteRef: oneDrive.remoteRef,
        lastSyncedAt: oneDrive.lastSyncedAt,
        lastEtag: oneDrive.lastEtag,
        personalRef: oneDrive.personalRef,
        signInExpired: oneDrive.signInExpired,
        autoSignIn: oneDrive.autoSignIn,
        personalLastSyncedAt: oneDrive.personalLastSyncedAt,
        accountLabel: oneDrive.accountLabel
      }));
    } catch (e) {}
  }

  // ---------------------------------------------------------------
  // Sharing with OneDrive: a "Ledger" folder in one person's OneDrive
  // holds entries.json; the other person accesses it via a normal
  // OneDrive share invite. No backend — the app talks to Microsoft's
  // login and Graph API directly using OAuth 2.0 + PKCE (a public
  // client flow that needs no server-held secret), scoped to personal
  // Microsoft accounts only ("consumers"). Since OneDrive is file-based
  // rather than a real database, entries carry an `updatedAt` stamp and
  // deletions are tracked as tombstones so two devices merge safely
  // instead of overwriting each other's changes.
  // ---------------------------------------------------------------
  var ONEDRIVE_AUTHORITY = 'https://login.microsoftonline.com/consumers';
  var ONEDRIVE_SCOPES = 'Files.ReadWrite offline_access User.Read';
  var GRAPH_BASE = 'https://graph.microsoft.com/v1.0';
  var TOMBSTONE_MAX_AGE_MS = 180 * 86400000;
  var syncDebounceTimer = null;

  function oneDriveRedirectUri() { return window.location.origin + window.location.pathname; }

  function base64UrlEncode(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function randomString(len) {
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return base64UrlEncode(arr.buffer).slice(0, len);
  }

  async function pkceChallengeFromVerifier(verifier) {
    var data = new TextEncoder().encode(verifier);
    var digest = await crypto.subtle.digest('SHA-256', data);
    return base64UrlEncode(digest);
  }

  var SILENT_ATTEMPT_KEY = 'ledger.onedrive.silentAttempt.v1';
  function lastSilentAttempt() {
    try { return parseInt(localStorage.getItem(SILENT_ATTEMPT_KEY), 10) || 0; } catch (e) { return 0; }
  }

  async function startOneDriveLogin(opts) {
    if (!oneDrive.clientId) return;
    var silent = !!(opts && opts.silent);
    if (silent) { try { localStorage.setItem(SILENT_ATTEMPT_KEY, String(Date.now())); } catch (e) {} }
    var verifier = randomString(64);
    var challenge = await pkceChallengeFromVerifier(verifier);
    var loginState = randomString(24);
    try {
      sessionStorage.setItem('ledger.onedrive.pkce', verifier);
      sessionStorage.setItem('ledger.onedrive.state', loginState);
    } catch (e) {}
    var params = new URLSearchParams({
      client_id: oneDrive.clientId,
      response_type: 'code',
      redirect_uri: oneDriveRedirectUri(),
      response_mode: 'query',
      scope: ONEDRIVE_SCOPES,
      code_challenge: challenge,
      code_challenge_method: 'S256',
      state: loginState
    });
    if (oneDrive.accountLabel && oneDrive.accountLabel.indexOf('@') !== -1) params.set('login_hint', oneDrive.accountLabel);
    if (silent) params.set('prompt', 'none');
    window.location.assign(ONEDRIVE_AUTHORITY + '/oauth2/v2.0/authorize?' + params.toString());
  }

  function applyTokenResponse(json) {
    oneDrive.accessToken = json.access_token;
    oneDrive.accessTokenExpiry = Date.now() + (json.expires_in ? json.expires_in * 1000 : 0) - 60000;
    if (json.refresh_token) { oneDrive.refreshToken = json.refresh_token; oneDrive.signInExpired = false; }
  }

  async function handleOneDriveRedirect() {
    var url = new URL(window.location.href);
    var code = url.searchParams.get('code');
    var returnedState = url.searchParams.get('state');
    var authError = url.searchParams.get('error');
    if (!code && !authError) return false;
    url.searchParams.delete('code');
    url.searchParams.delete('state');
    url.searchParams.delete('session_state');
    url.searchParams.delete('error');
    url.searchParams.delete('error_description');
    var qs = url.searchParams.toString();
    window.history.replaceState({}, document.title, url.pathname + (qs ? '?' + qs : ''));
    if (authError) {
      var wasSilent = Date.now() - lastSilentAttempt() < 120000;
      if (wasSilent && /login_required|interaction_required|consent_required|account_selection_required/.test(authError)) {
        oneDrive.signInExpired = true;
        saveOneDriveConfig();
        return true;
      }
      oneDrive.lastError = authError;
      return true;
    }
    var expectedState = sessionStorage.getItem('ledger.onedrive.state');
    var verifier = sessionStorage.getItem('ledger.onedrive.pkce');
    try {
      sessionStorage.removeItem('ledger.onedrive.state');
      sessionStorage.removeItem('ledger.onedrive.pkce');
    } catch (e) {}
    if (!verifier || returnedState !== expectedState) { oneDrive.lastError = 'state_mismatch'; return true; }
    try {
      var body = new URLSearchParams({
        client_id: oneDrive.clientId,
        scope: ONEDRIVE_SCOPES,
        code: code,
        redirect_uri: oneDriveRedirectUri(),
        grant_type: 'authorization_code',
        code_verifier: verifier

      var res = await fetch(ONEDRIVE_AUTHORITY + '/oauth2/v2.0/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });
      var json = await res.json();
      if (!res.ok) { oneDrive.lastError = json.error || 'token_error'; return true; }
      applyTokenResponse(json);
      saveOneDriveConfig();
      await fetchAccountLabel();
      saveOneDriveConfig();
      await syncOneDrive();
    } catch (e) { oneDrive.lastError = 'network'; }
    return true;
  }

  async function getOneDriveAccessToken() {

    if (!oneDrive.refreshToken || !oneDrive.clientId) return null;
    try {
      var body = new URLSearchParams({
        client_id: oneDrive.clientId,
        scope: ONEDRIVE_SCOPES,
        refresh_token: oneDrive.refreshToken,
        grant_type: 'refresh_token'
      });
      var res = await fetch(ONEDRIVE_AUTHORITY + '/oauth2/v2.0/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });
      var json = await res.json();
      if (!res.ok) {
        oneDrive.lastError = json.error || 'refresh_error';
        if (json.error === 'invalid_grant' || json.error === 'interaction_required') {
          oneDrive.refreshToken = null;
          oneDrive.accessToken = null;
          oneDrive.signInExpired = true;
          saveOneDriveConfig();
          renderSignInBanner();
        }
        return null;
      }
      applyTokenResponse(json);
      saveOneDriveConfig();
      return oneDrive.accessToken;
    } catch (e) { oneDrive.lastError = 'network'; return null; }
  }

  function graphFetch(path, token, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {}, { Authorization: 'Bearer ' + token });
    return fetch(GRAPH_BASE + path, Object.assign({}, options, { headers: headers }));
  }

  async function fetchAccountLabel() {
    var token = await getOneDriveAccessToken();
    if (!token) return;
    try {
      var res = await graphFetch('/me', token);
      if (res.ok) {
        var me = await res.json();
        oneDrive.accountLabel = me.mail || me.userPrincipalName || null;
      }
    } catch (e) {}
  }

  // Finds the shared "Ledger" folder: first a folder someone shared with this
  // account, then one in the account's own OneDrive. A new folder is only
  // created after the person confirmed it, so someone who is joining a shared
  // Ledger never ends up quietly syncing with an empty folder of their own.
  async function resolveLedgerLocation(token) {
    if (oneDrive.remoteRef) return oneDrive.remoteRef;
    var sharedRes = await graphFetch('/me/drive/sharedWithMe', token);
    if (sharedRes.ok) {
      var sharedJson = await sharedRes.json();
      var match = (sharedJson.value || []).find(function (item) {
        return item.remoteItem && item.remoteItem.name === 'Ledger' && item.remoteItem.folder;
      });
      if (match) {
        var sh = match.remoteItem.shared || {};
        var who = (sh.owner && sh.owner.user) || (sh.sharedBy && sh.sharedBy.user) || null;
        return {
          driveId: match.remoteItem.parentReference.driveId, folderId: match.remoteItem.id, mode: 'shared',
          ownerLabel: who ? String(who.displayName || who.email || '').slice(0, 80) : ''
        };
      }
    }
    var own = await graphFetch('/me/drive/root:/Ledger', token);
    if (own.ok) {
      var ownJson = await own.json();
      return { driveId: ownJson.parentReference.driveId, folderId: ownJson.id, mode: 'own' };
    }
    if (!oneDrive.allowCreate) throw new Error('no_ledger_found');
    var createRes = await graphFetch('/me/drive/root/children', token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'Ledger', folder: {}, '@microsoft.graph.conflictBehavior': 'fail' })
    });
    if (createRes.ok) {
      var createdJson = await createRes.json();
      return { driveId: createdJson.parentReference.driveId, folderId: createdJson.id, mode: 'own' };
    }
    throw new Error('resolve_failed');
  }

  // The personal profile syncs to its own folder in the signed-in account's
  // OneDrive. It is looked up by name in that account's own drive only and is
  // never offered for sharing, so it cannot be reached through the shared
  // "Ledger" folder.
  var PERSONAL_FOLDER = 'Ledger Personal';

  async function resolvePersonalLocation(token) {
    if (oneDrive.personalRef) return oneDrive.personalRef;
    var existing = await graphFetch('/me/drive/root:/' + encodeURIComponent(PERSONAL_FOLDER), token);
    if (existing.ok) {
      var existingJson = await existing.json();
      return { driveId: existingJson.parentReference.driveId, folderId: existingJson.id };
    }
    if (existing.status !== 404) throw new Error('resolve_failed');
    var createRes = await graphFetch('/me/drive/root/children', token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: PERSONAL_FOLDER, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' })
    });
    if (createRes.ok) {
      var createdJson = await createRes.json();
      return { driveId: createdJson.parentReference.driveId, folderId: createdJson.id };
    }
    throw new Error('resolve_failed');
  }

  async function downloadLedgerFile(token, ref) {
    var res = await graphFetch('/drives/' + ref.driveId + '/items/' + ref.folderId + ':/entries.json:/content', token);
    if (res.status === 404) return { data: null, etag: null };
    if (!res.ok) throw new Error('download_failed_' + res.status);
    var etag = res.headers.get('ETag');
    var json = await res.json();
    return { data: json, etag: etag };
  }

  async function uploadLedgerFile(token, ref, payload, ifMatchEtag) {
    var headers = { 'Content-Type': 'application/json' };
    if (ifMatchEtag) headers['if-match'] = ifMatchEtag;
    var res = await graphFetch('/drives/' + ref.driveId + '/items/' + ref.folderId + ':/entries.json:/content', token, {
      method: 'PUT', headers: headers, body: JSON.stringify(payload)
    });
    if (res.status === 412) return { conflict: true };
    if (!res.ok) throw new Error('upload_failed_' + res.status);
    var json = await res.json();
    return { conflict: false, etag: json.eTag || null };
  }

  async function sendLedgerInvite(email) {
    var token = await getOneDriveAccessToken();
    if (!token || !oneDrive.remoteRef) throw new Error('not_ready');
    var res = await graphFetch('/drives/' + oneDrive.remoteRef.driveId + '/items/' + oneDrive.remoteRef.folderId + '/invite', token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipients: [{ email: email }],
        message: 'Delar Ledger med dig så vi ser samma utgifter.',
        requireSignIn: true, sendInvitation: true, roles: ['write']
      })
    });
    if (!res.ok) throw new Error('invite_failed_' + res.status);
  }

  async function shareLedgerWith(email) {
    var statusEl = document.getElementById('oneDriveShareStatus');
    if (statusEl) statusEl.textContent = 'Sending invite…';
    try {
      await sendLedgerInvite(email);
      if (statusEl) statusEl.textContent = 'Invite sent to ' + email + '.';
      fetchLedgerPermissions();
    } catch (e) {
      if (statusEl) statusEl.textContent = 'Could not send invite (' + (e && e.message) + ').';
    }
  }

  // Lists who the shared "Ledger" folder has been invited to / has access,
  // via OneDrive's own sharing (only meaningful from the owner's side).
  async function fetchLedgerPermissions() {
    var listEl = document.getElementById('oneDrivePermissionsList');
    if (!listEl || !oneDrive.remoteRef || oneDrive.remoteRef.mode !== 'own') return;
    listEl.textContent = 'Loading…';
    try {
      var token = await getOneDriveAccessToken();
      if (!token) throw new Error('no_token');
      var res = await graphFetch('/drives/' + oneDrive.remoteRef.driveId + '/items/' + oneDrive.remoteRef.folderId + '/permissions', token);
      if (!res.ok) throw new Error('permissions_failed_' + res.status);
      var json = await res.json();
      var people = (json.value || []).map(function (p) {
        var identity = (p.grantedToV2 && p.grantedToV2.user) || (p.grantedTo && p.grantedTo.user) || null;
        var label = identity ? (identity.displayName || identity.email || identity.id)
          : (p.invitation && p.invitation.email) || 'Pending invite';
        var roles = (p.roles || []).join(', ');
        return (roles ? label + ' (' + roles + ')' : label).replace(/</g, '&lt;');
      });
      listEl.innerHTML = people.length
        ? people.map(function (p) { return '<div>' + p + '</div>'; }).join('')
        : '<span class="hint">Just you so far.</span>';
    } catch (e) {
      listEl.textContent = 'Could not load (' + (e && e.message) + ')';
    }
  }

  // Union-merge by entry id, newest `updatedAt`/`ts` wins; a tombstone
  // (from either side) removes an entry unless it was edited again after
  // the deletion. Pure function so it's easy to test without a network.
  function mergeLedgerData(localEntries, localDeleted, remoteEntries, remoteDeleted) {
    var deletedMap = {};
    (localDeleted || []).concat(remoteDeleted || []).forEach(function (d) {
      if (!deletedMap[d.id] || d.deletedAt > deletedMap[d.id]) deletedMap[d.id] = d.deletedAt;
    });
    var byId = {};
    (localEntries || []).concat(remoteEntries || []).forEach(function (e) {
      var stamp = e.updatedAt || e.ts || 0;
      var existing = byId[e.id];
      var existingStamp = existing ? (existing.updatedAt || existing.ts || 0) : -1;
      if (!existing || stamp > existingStamp) byId[e.id] = e;
    });
    var cutoff = Date.now() - TOMBSTONE_MAX_AGE_MS;
    var entries = Object.keys(byId).map(function (id) { return byId[id]; }).filter(function (e) {
      var d = deletedMap[e.id];
      return !d || d < (e.updatedAt || e.ts || 0);
    });
    var deletedIds = Object.keys(deletedMap)
      .filter(function (id) { return deletedMap[id] > cutoff; })
      .map(function (id) { return { id: id, deletedAt: deletedMap[id] }; });
    return { entries: entries, deletedIds: deletedIds };
  }

  // Budget settings travel in the same OneDrive file as the entries. Each
  // setting group carries the time it was last edited on purpose; the newer
  // edit wins. Settlements are unioned by period; the earliest tracking
  // start is kept.
  var SETTING_GROUPS = ['allowance', 'monthStartDay', 'fun', 'categories'];

  function buildSettingsPayload() {
    return {
      v: 1,
      allowance: (state.allowance !== null && !isNaN(state.allowance)) ? state.allowance : null,
      monthStartDay: state.monthStartDay,
      categories: state.categories.slice(),
      funTarget: state.buckets.funTarget === undefined ? null : state.buckets.funTarget,
      funNote: state.buckets.funNote || '',
      trackingStart: state.buckets.trackingStart || null,
      settlements: state.buckets.settlements.map(function (x) { return Object.assign({}, x); }),
      transfers: state.buckets.transfers.map(function (x) { return Object.assign({}, x); }),
      meta: Object.assign({}, state.settingsMeta)
    };
  }

  function sanitizeSettings(r) {
    if (!r || typeof r !== 'object') return null;
    function num(v) { return typeof v === 'number' && isFinite(v); }
    var meta = (r.meta && typeof r.meta === 'object') ? r.meta : {};
    var out = { meta: {} };
    SETTING_GROUPS.forEach(function (g) { out.meta[g] = num(meta[g]) ? meta[g] : 0; });
    out.allowance = (num(r.allowance) && r.allowance >= 0) ? r.allowance : null;
    out.monthStartDay = (num(r.monthStartDay) && r.monthStartDay >= 1 && r.monthStartDay <= 31) ? Math.floor(r.monthStartDay) : null;
    var seen = {};
    out.categories = Array.isArray(r.categories)
      ? r.categories.filter(function (c) { return typeof c === 'string' && c.trim() && c.length <= 60; })
          .map(function (c) { return c.trim(); })
          .filter(function (c) { if (seen[c]) return false; seen[c] = true; return true; })
      : null;
    out.funTarget = (num(r.funTarget) && r.funTarget >= 0) ? r.funTarget : null;
    out.funNote = typeof r.funNote === 'string' ? r.funNote.slice(0, 200) : '';
    out.trackingStart = (typeof r.trackingStart === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.trackingStart)) ? r.trackingStart : null;
    out.settlements = Array.isArray(r.settlements)
      ? r.settlements.filter(function (x) {
          return x && typeof x.periodKey === 'string' && num(x.bufferAtEnd) && num(x.takenFromFun) && num(x.toFun) && num(x.carryToNext) && num(x.settledAt);
        }).map(function (x) {
          return { periodKey: x.periodKey, bufferAtEnd: x.bufferAtEnd, takenFromFun: x.takenFromFun, toFun: x.toFun, carryToNext: x.carryToNext, settledAt: x.settledAt };
        })
      : [];
    out.transfers = Array.isArray(r.transfers)
      ? r.transfers.filter(function (x) {
          return x && typeof x.id === 'string' && x.id.length <= 40 && typeof x.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && num(x.amount) && x.amount !== 0 && num(x.at);
        }).map(function (x) { return { id: x.id, date: x.date, amount: x.amount, at: x.at }; })
      : [];
    return out;
  }

  function mergeSettingsData(local, remoteRaw, preferRemote) {
    var remote = sanitizeSettings(remoteRaw);
    if (!remote) return local;
    var lm = local.meta || {};
    var out = {
      v: 1, allowance: local.allowance, monthStartDay: local.monthStartDay, categories: local.categories,
      funTarget: local.funTarget, funNote: local.funNote, trackingStart: local.trackingStart, settlements: [], transfers: [],
      meta: { allowance: lm.allowance || 0, monthStartDay: lm.monthStartDay || 0, fun: lm.fun || 0, categories: lm.categories || 0 }
    };
    if ((preferRemote || remote.meta.allowance >= out.meta.allowance) && remote.allowance !== null) {
      out.allowance = remote.allowance; out.meta.allowance = remote.meta.allowance;
    }
    if ((preferRemote || remote.meta.monthStartDay >= out.meta.monthStartDay) && remote.monthStartDay !== null) {
      out.monthStartDay = remote.monthStartDay; out.meta.monthStartDay = remote.meta.monthStartDay;
    }
    if ((preferRemote || remote.meta.categories >= out.meta.categories) && remote.categories && remote.categories.length) {
      out.categories = remote.categories; out.meta.categories = remote.meta.categories;
    }
    if (preferRemote || remote.meta.fun >= out.meta.fun) {
      out.funTarget = remote.funTarget; out.funNote = remote.funNote; out.meta.fun = remote.meta.fun;
    }
    if (remote.trackingStart && (!local.trackingStart || remote.trackingStart < local.trackingStart)) out.trackingStart = remote.trackingStart;
    var byKey = {};
    (local.settlements || []).concat(remote.settlements).forEach(function (st) {
      var existing = byKey[st.periodKey];
      if (!existing) { byKey[st.periodKey] = st; return; }
      if (st.periodKey === '__migration__') { if (st.toFun > existing.toFun) byKey[st.periodKey] = st; }
      else if (st.settledAt > existing.settledAt) byKey[st.periodKey] = st;
    });
    out.settlements = Object.keys(byKey).map(function (k) { return byKey[k]; })
      .sort(function (a, b) { return a.settledAt - b.settledAt; });
    var tById = {};
    (local.transfers || []).concat(remote.transfers).forEach(function (t) { if (!tById[t.id]) tById[t.id] = t; });
    out.transfers = Object.keys(tById).map(function (k) { return tById[k]; }).sort(function (a, b) { return a.at - b.at; });
    return out;
  }

  function applySettingsPayload(merged) {
    var hadAllowance = state.allowance !== null && !isNaN(state.allowance);
    if (merged.allowance !== null && merged.allowance !== undefined && state.allowance !== merged.allowance) {
      state.allowance = merged.allowance;
      saveAllowance();
    }
    if (merged.monthStartDay && state.monthStartDay !== merged.monthStartDay) {
      state.monthStartDay = merged.monthStartDay;
      saveMonthStartDay();
    }
    var cats = (merged.categories || state.categories).slice();
    state.entries.forEach(function (e) { if (e.category && cats.indexOf(e.category) === -1) cats.push(e.category); });
    if (JSON.stringify(cats) !== JSON.stringify(state.categories)) {
      state.categories = cats;
      saveCategories();
    }
    var before = JSON.stringify(state.buckets);
    state.buckets.funTarget = merged.funTarget === undefined ? null : merged.funTarget;
    state.buckets.funNote = merged.funNote || '';
    state.buckets.trackingStart = merged.trackingStart || state.buckets.trackingStart || null;
    state.buckets.settlements = merged.settlements.slice();
    state.buckets.transfers = (merged.transfers || state.buckets.transfers).slice();
    if (JSON.stringify(state.buckets) !== before) saveBuckets();
    state.settingsMeta = Object.assign({}, merged.meta);
    saveSettingsMeta();
    if (!hadAllowance && state.allowance !== null && !isNaN(state.allowance) && document.getElementById('allowanceInput')) closePanel();
  }

  function friendlyOneDriveError(code) {
    switch (code) {
      case 'no_ledger_found': return 'No shared Ledger found yet. If someone is sharing one with you, ask them to send the invite and accept it, then tap Sync now.';
      case 'state_mismatch': return 'The sign-in could not be completed on this device. Tap Connect to try again.';
      case 'access_denied': return 'The sign-in was cancelled.';
      case 'network': return 'Could not reach Microsoft. Check your connection and try again.';
      case 'invalid_grant': return 'Your Microsoft sign-in expired. Sign in again to keep syncing.';
      default: return 'Last error: ' + code;
    }
  }

  function oneDriveStatusText() {
    var lines = [oneDrive.accountLabel ? 'Signed in as ' + oneDrive.accountLabel : 'Signed in'];
    var lastSynced = activeProfile === 'shared' ? oneDrive.lastSyncedAt : oneDrive.personalLastSyncedAt;
    lines.push(oneDrive.syncing ? 'Syncing…' : (lastSynced ? 'Last synced ' + formatTimestamp(lastSynced) : 'Not synced yet'));
    if (oneDrive.lastError) lines.push(friendlyOneDriveError(oneDrive.lastError));
    return lines.join(' · ');
  }

  function renderOneDriveStatus() {
    var el = document.getElementById('oneDriveStatus');
    if (el) el.textContent = oneDriveStatusText();
  }

  function scheduleSync() {
    if (!oneDrive.clientId || !oneDrive.refreshToken) return;
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(function () { syncOneDrive(); }, 1500);
  }

  // Syncs whichever profile is active when it starts: "shared" with the
  // shared Ledger folder, "personal" with the private Ledger Personal folder.
  // If the person switches profile while the network calls are in flight, the
  // download is thrown away before anything is applied, so one profile's data
  // can never be written into the other; the sync is re-queued instead.
  async function syncOneDrive() {
    if (!oneDrive.clientId || !oneDrive.refreshToken || oneDrive.syncing) return;
    var profile = activeProfile;
    var epoch = profileEpoch;
    var aborted = false;
    var isFirstSync = profile === 'shared' ? !oneDrive.lastSyncedAt : !oneDrive.personalLastSyncedAt;
    var prevError = oneDrive.lastError;
    oneDrive.syncing = true;
    renderOneDriveStatus();
    try {
      var token = await getOneDriveAccessToken();
      if (!token) throw new Error('no_token');
      var ref;
      if (profile === 'shared') {
        ref = oneDrive.remoteRef || await resolveLedgerLocation(token);
        oneDrive.remoteRef = ref;
      } else {
        ref = oneDrive.personalRef || await resolvePersonalLocation(token);
        oneDrive.personalRef = ref;
      }
      for (var attempt = 0; attempt < 3; attempt++) {
        var remote = await downloadLedgerFile(token, ref);
        if (epoch !== profileEpoch) { aborted = true; break; }
        var remoteData = remote.data || { entries: [], deletedIds: [] };
        var merged = mergeLedgerData(state.entries, state.deletedIds, remoteData.entries, remoteData.deletedIds);
        state.entries = merged.entries;
        state.deletedIds = merged.deletedIds;
        saveEntries();
        saveDeletedIds();
        applySettingsPayload(mergeSettingsData(buildSettingsPayload(), remoteData.settings, isFirstSync));
        var result = await uploadLedgerFile(token, ref, { entries: state.entries, deletedIds: state.deletedIds, settings: buildSettingsPayload() }, remote.etag);
        if (!result.conflict) { if (profile === 'shared') oneDrive.lastEtag = result.etag; break; }
      }
      if (!aborted) {
        if (profile === 'shared') oneDrive.lastSyncedAt = Date.now();
        else oneDrive.personalLastSyncedAt = Date.now();
        oneDrive.lastError = null;
        oneDrive.allowCreate = false;
        saveOneDriveConfig();
        render();
      }
    } catch (e) {
      oneDrive.lastError = (e && e.message) || 'sync_failed';
    } finally {
      oneDrive.syncing = false;
      renderOneDriveStatus();
      if ((prevError === 'no_ledger_found') !== (oneDrive.lastError === 'no_ledger_found')) refreshOneDriveSection();
      if (aborted) scheduleSync();
    }
  }

  function dayKey(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function todayKey() { return dayKey(new Date()); }

  function formatMoney(n) {
    var sign = n < 0 ? '-' : '';
    var abs = Math.abs(n).toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return sign + abs + ' kr';
  }

  function authorLabel(email) {
    if (!email) return '';
    var at = email.indexOf('@');
    return at > 0 ? email.slice(0, at) : email;
  }

  // Cumulative under/over-budget trend for the current Analysis period:
  // a running (allowance - spent) total day by day, up to today, against
  // a dashed zero-line reference (spanning the full period) showing where
  // "exactly on budget" would sit.
  function budgetTrendChartHtml(period, days, budgetItems, startValue) {
    if (state.allowance === null || isNaN(state.allowance)) return '';
    var byDate = {};
    budgetItems.forEach(function (e) { byDate[e.date] = (byDate[e.date] || 0) + e.amount; });
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var series = [];
    var cum = startValue || 0;
    for (var i = 0; i < days; i++) {
      var d = new Date(period.start);
      d.setDate(period.start.getDate() + i);
      if (d.getTime() > today.getTime()) break;
      cum += state.allowance - (byDate[dayKey(d)] || 0);
      series.push(cum);
    }
    if (series.length === 0) return '';

    var W = 320, H = 120, padX = 8, padY = 14;
    var innerW = W - padX * 2, innerH = H - padY * 2;
    var values = series.concat([0]);
    var minVal = Math.min.apply(null, values), maxVal = Math.max.apply(null, values);
    if (minVal === maxVal) { minVal -= 100; maxVal += 100; }
    function xAt(i) { return padX + (days <= 1 ? 0 : (i / (days - 1)) * innerW); }
    function yAt(v) { return padY + innerH - ((v - minVal) / (maxVal - minVal)) * innerH; }

    var pathD = series.map(function (v, i) { return (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1); }).join(' ');
